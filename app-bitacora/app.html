<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F5132">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<title>Bitácora</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --pri:#0F5132; --pri2:#15803D; --bg:#F1F5F9; --card:#FFFFFF; --txt:#0F172A; --sub:#64748B; --ok:#16A34A; --warn:#D97706; --err:#DC2626; --azul:#2563EB; --borde:#E2E8F0; color-scheme: light; }
  * { box-sizing: border-box; }
  /* Sin zoom de página (v1.4.0): doble toque y pellizco desactivados fuera de los mapas; campos a 16px para que el iPhone no amplíe al escribir */
  html { touch-action: manipulation; -webkit-text-size-adjust:100%; }
  input, select, textarea { font-size:16px !important; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); -webkit-text-size-adjust:100%; }
  #v-app { height:100vh; height:100dvh; display:flex; flex-direction:column; }
  header { background: var(--pri); color:#fff; padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left)); display:flex; align-items:center; gap:8px; flex:0 0 auto; z-index:7; }
  header h1 { font-size:17px; margin:0; }
  header small { opacity:.85; font-size:11px; display:block; font-weight:500; }
  .btn-w { background: transparent; color:#fff; border:1px solid rgba(255,255,255,.4); border-radius:10px; padding:8px 10px; min-width:44px; min-height:40px; font:inherit; font-weight:700; cursor:pointer; }
  .ico-salir { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; vertical-align:middle; }
  .pend-pill { background:#FDE68A; color:#78350F; border-radius:999px; padding:3px 9px; font-size:12px; font-weight:800; border:0; cursor:pointer; }
  main { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding: 12px 14px 18px; width:100%; max-width: 760px; margin: 0 auto; }
  .btn { border-radius:10px; padding:11px 14px; font:inherit; font-weight:700; cursor:pointer; background: var(--card); color: var(--txt); border:1px solid var(--borde); }
  .btn-p { background: var(--pri2); color:#fff; border-color: var(--pri2); }
  .btn-rojo { color:#B91C1C; border-color:#FCA5A5; }
  .btn:disabled { opacity:.5; }
  .btn-mini { padding:6px 10px; font-size:12.5px; border-radius:8px; }
  .card { background: var(--card); border:1px solid var(--borde); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .muted { color: var(--sub); font-size:12px; }
  input, select, textarea { width:100%; font:inherit; padding:10px 11px; border:1px solid var(--borde); border-radius:10px; background: var(--card); color: var(--txt); }
  label { display:block; font-size:12px; font-weight:700; color: var(--sub); margin: 10px 0 4px; }
  .fila { display:flex; gap:8px; }
  .fila > * { flex:1; min-width:0; }
  .aviso { background:#FEF3C7; color:#92400E; border-radius:10px; padding:9px 11px; font-size:12.5px; margin:8px 0; }
  .aviso.ok { background:#DCFCE7; color:#14532D; }
  .aviso.err { background:#FEE2E2; color:#7F1D1D; }
  .aviso.info { background:#DBEAFE; color:#1E3A8A; }
  .vacio { text-align:center; color: var(--sub); padding:30px 10px; }
  .pill { display:inline-block; padding:3px 9px; border-radius:999px; background: var(--borde); font-size:11.5px; font-weight:700; margin:2px 3px 2px 0; white-space:nowrap; }
  /* Menú inferior */
  .menu { flex:0 0 auto; display:grid; grid-template-columns: repeat(5,1fr); background: var(--card); border-top:1px solid var(--borde); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:6; }
  .menu button { border:0; background:none; color: var(--sub); font:inherit; font-size:11px; font-weight:700; padding:6px 2px; cursor:pointer; }
  .menu button.on { color: var(--pri2); }
  .menu .ico { font-size:20px; display:block; }
  /* Fecha */
  .fecha-nav { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .fecha-nav button { flex:0 0 auto; width:44px; height:40px; border-radius:10px; border:1px solid var(--borde); background: var(--card); font-size:16px; font-weight:800; cursor:pointer; }
  .fecha-nav button:disabled { opacity:.35; }
  .fecha-nav .f-txt { flex:1; text-align:center; font-weight:800; font-size:15px; text-transform:capitalize; }
  .fecha-nav .f-txt small { display:block; font-size:11px; font-weight:600; color: var(--sub); text-transform:none; }
  /* KPIs */
  .kpis { display:grid; grid-template-columns: repeat(4, 1fr); gap:6px; margin-bottom:10px; }
  .kpi { background: var(--card); border:1px solid var(--borde); border-radius:12px; padding:8px 6px; text-align:center; cursor:pointer; border-top:4px solid var(--c, var(--borde)); }
  .kpi b { font-size:22px; display:block; line-height:1.1; }
  .kpi span { font-size:10.5px; color: var(--sub); font-weight:700; }
  .kpi.on { outline:2px solid var(--c); }
  .filtros { display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:10px; }
  .filtros input { grid-column: 1 / -1; }
  .filtros select, .filtros input { padding:8px 10px; }
  /* Tarjetas de recursos */
  .grupo-t { font-size:12px; font-weight:800; color: var(--sub); text-transform:uppercase; letter-spacing:.4px; margin:14px 2px 6px; }
  .rec { display:flex; gap:10px; align-items:flex-start; background: var(--card); border:1px solid var(--borde); border-left:5px solid var(--c, var(--borde)); border-radius:12px; padding:10px 12px; margin-bottom:8px; cursor:pointer; }
  .rec:active { background:#F8FAFC; }
  .rec .r-ico { font-size:24px; line-height:1; flex:0 0 auto; margin-top:2px; }
  .rec .r-cuerpo { flex:1; min-width:0; }
  .rec .r-top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
  .rec .r-nom { font-weight:800; font-size:15px; }
  .rec .r-sub { font-size:12px; color: var(--sub); margin-top:1px; }
  .rec .r-det { font-size:12.5px; margin-top:5px; }
  .st { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:800; white-space:nowrap; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  .chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:5px; }
  .chip-d { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:#FEF3C7; color:#92400E; }
  .chip-p { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:#FDE68A; color:#78350F; }
  .chip-e { font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:#FEE2E2; color:#991B1B; }
  /* Semana */
  .sem-wrap { overflow-x:auto; background: var(--card); border:1px solid var(--borde); border-radius:12px; }
  table.sem { border-collapse:collapse; width:100%; font-size:12px; }
  table.sem th, table.sem td { border-bottom:1px solid var(--borde); padding:6px 4px; text-align:center; white-space:nowrap; }
  table.sem th:first-child, table.sem td:first-child { text-align:left; position:sticky; left:0; background: var(--card); padding-left:10px; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
  table.sem td.c { cursor:pointer; font-size:16px; }
  table.sem th.hoy { color: var(--pri2); }
  .leyenda { display:flex; flex-wrap:wrap; gap:6px 12px; font-size:11.5px; color: var(--sub); margin:8px 2px; }
  /* Mapa */
  .mapa-tab { height:62vh; min-height:320px; border-radius:12px; overflow:hidden; border:1px solid var(--borde); background:#DDE3EA; position:relative; }
  .mt-base { position:absolute; top:8px; left:8px; z-index:1000; display:flex; background: rgba(255,255,255,.94); border-radius:999px; padding:3px; box-shadow: 0 2px 8px rgba(2,6,23,.3); }
  .mt-base button { border:0; background:none; font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; }
  .mt-base button.on { background: var(--azul); color:#fff; }
  .pop b { font-size:14px; } .pop div { font-size:12px; margin-top:3px; }
  /* Hoja (formulario / ficha) */
  .overlay { position:fixed; inset:0; background: rgba(15,23,42,.6); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .overlay.show { display:flex; }
  .sheet { background: var(--card); width:calc(100% - 16px); max-width:760px; max-height:92vh; display:flex; flex-direction:column; border-radius:20px; margin:0 8px 8px; overflow:hidden; }
  .sh-top { display:flex; gap:10px; align-items:flex-start; padding:14px 16px 10px; border-bottom:1px solid var(--borde); flex:0 0 auto; }
  .sh-top h2 { font-size:16px; margin:0; }
  .sh-x { border:0; background: var(--bg); color: var(--sub); width:34px; height:34px; border-radius:50%; font-size:15px; cursor:pointer; flex:0 0 auto; }
  .sh-body { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:10px 16px 14px; }
  .sh-foot { flex:0 0 auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--borde); display:flex; gap:8px; flex-wrap:wrap; }
  .sh-foot .btn { flex:1; min-width:120px; }
  .btn-grande { height:48px; font-size:15px; border:0; background: linear-gradient(90deg, #15803D, #0F766E); color:#fff; }
  .sec { border-top:1px solid var(--borde); padding:10px 0 4px; margin-top:6px; }
  .sec:first-child { border-top:0; margin-top:0; }
  .sec-t { font-size:13px; font-weight:800; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .seg { display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .seg button { border:1px solid var(--borde); background: var(--card); border-radius:12px; padding:12px 8px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; text-align:left; }
  .seg button.on { background: color-mix(in srgb, var(--pri2) 12%, white); border-color: var(--pri2); color: var(--pri); box-shadow: inset 0 0 0 1px var(--pri2); }
  .opc { display:flex; flex-wrap:wrap; gap:6px; }
  .opc button { border:1px solid var(--borde); background: var(--card); border-radius:999px; padding:8px 12px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .opc button.on { background: var(--pri2); color:#fff; border-color: var(--pri2); }
  .opc button small { font-weight:600; opacity:.8; }
  .dot-row { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--borde); }
  .dot-row:last-child { border-bottom:0; }
  .dot-row label { flex:1; display:flex; align-items:center; gap:10px; margin:0; color: var(--txt); font-size:14px; font-weight:600; cursor:pointer; min-width:0; }
  .dot-row label input { width:22px; height:22px; flex:0 0 auto; accent-color: var(--pri2); margin:0; }
  .dot-row label span { min-width:0; }
  .dot-row small { display:block; color: var(--sub); font-weight:500; font-size:11.5px; }
  .dot-row.fuera label { color: var(--sub); }
  .star { border:0; background:none; font-size:22px; cursor:pointer; opacity:.22; padding:2px 4px; }
  .star.on { opacity:1; }
  .quitar { border:0; background:none; color: var(--err); font-weight:800; font-size:16px; cursor:pointer; padding:2px 6px; }
  .agregar { margin-top:8px; padding:10px; background: var(--bg); border-radius:12px; }
  .chk { display:flex; align-items:center; gap:8px; color: var(--txt); font-size:13.5px; font-weight:600; margin-top:10px; }
  .chk input { width:20px; height:20px; margin:0; accent-color: var(--pri2); }
  .geo-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; margin-bottom:8px; }
  .dato { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--borde); font-size:14px; }
  .dato span:first-child { color: var(--sub); }
  .dato b { text-align:right; }
  .tel { color: var(--azul); font-weight:700; text-decoration:none; margin-left:6px; white-space:nowrap; }
  /* Mapa del formulario */
  .av-mapa { position:relative; height:170px; border-radius:12px; overflow:hidden; border:1px solid var(--borde); background: var(--bg); display:flex; align-items:center; justify-content:center; }
  .av-leaf { position:absolute; inset:0; background:#DDE3EA; }
  .av-relieve-capa { mix-blend-mode:multiply; opacity:.45; }
  .av-capas { position:absolute; top:8px; left:8px; display:flex; background: rgba(255,255,255,.94); border-radius:999px; padding:3px; box-shadow: 0 2px 8px rgba(2,6,23,.3); z-index:1000; }
  .av-capas button { border:0; background:none; color:#0F172A; font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; min-height:32px; }
  .av-capas button.on { background: var(--azul); color:#fff; }
  .av-grande { position:absolute; top:8px; right:8px; z-index:1000; width:40px; height:40px; border:0; border-radius:10px; background: rgba(255,255,255,.94); color:#0F172A; font-size:20px; font-weight:800; cursor:pointer; box-shadow: 0 2px 8px rgba(2,6,23,.3); }
  .av-pin-ico { background:none; border:0; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .av-cap { position:absolute; left:8px; bottom:8px; z-index:1000; max-width:calc(100% - 70px); background: rgba(15,23,42,.78); color:#fff; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .av-mapa.grande { position:fixed; inset:0; height:auto !important; z-index:60; border-radius:0; border:0; margin:0; }
  .av-listo { display:none; position:absolute; left:50%; transform:translateX(-50%); bottom:calc(52px + env(safe-area-inset-bottom)); z-index:1000; border:0; border-radius:999px; padding:12px 22px; font:inherit; font-size:15px; font-weight:800; color:#fff; background: linear-gradient(90deg, #15803D, #0F766E); box-shadow: 0 8px 20px rgba(2,6,23,.4); cursor:pointer; white-space:nowrap; }
  .av-mapa.grande .av-listo { display:block; }
  .av-mapa.grande .av-capas { top:calc(10px + env(safe-area-inset-top)); }
  .av-mapa.grande .av-grande { top:calc(10px + env(safe-area-inset-top)); }
  .av-mapa .leaflet-control-zoom a { width:34px; height:34px; line-height:34px; font-size:18px; }
  /* Login */
  .login { position:fixed; inset:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 15% 10%, #22C55E 0%, transparent 50%), linear-gradient(160deg, #0F5132 0%, #0F766E 100%); z-index:20; }
  .lg-card { width:100%; max-width:380px; background: var(--card); border-radius:22px; padding:26px 22px 20px; box-shadow: 0 24px 60px rgba(2,6,23,.35); }
  .lg-logo { display:block; width:80px; height:80px; margin:0 auto 10px; border-radius:20px; box-shadow: 0 8px 20px rgba(2,6,23,.25); }
  .lg-titulo { text-align:center; font-size:21px; font-weight:800; color: var(--pri); margin:0; }
  .lg-sub { text-align:center; font-size:13px; color: var(--sub); margin:6px 0 18px; }
  .lg-btn { width:100%; height:48px; margin-top:16px; border:0; border-radius:12px; font-size:15px; background: linear-gradient(90deg, #15803D, #0F766E); color:#fff; }
  .lg-pie { text-align:center; font-size:11px; color: var(--sub); margin-top:16px; }
  .perfil-head { display:flex; gap:12px; align-items:center; }
  .avatar { width:56px; height:56px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#fff; background: linear-gradient(135deg, #15803D, #0F766E); }
  .pend-item { border-top:1px solid var(--borde); padding:9px 0; font-size:13px; }
  .franja-version { position:fixed; left:0; right:0; top:0; z-index:60; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; padding-top:calc(8px + env(safe-area-inset-top)); background:#1E40AF; color:#fff; font-size:13px; font-weight:700; box-shadow:0 6px 18px rgba(2,6,23,.3); }
  .franja-version button { background:#fff; color:#1E40AF; border:0; border-radius:999px; padding:5px 12px; font-weight:800; font-size:12.5px; }
  .toast-msg { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); max-width:calc(100% - 32px); background:#0F172A; color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; font-weight:700; text-align:center; box-shadow: 0 12px 28px rgba(2,6,23,.35); z-index:70; }
  body.cargando main { opacity:.45; pointer-events:none; }
  body.cargando #h-actualizar { animation: giro 1s linear infinite; }
  @keyframes giro { to { transform: rotate(360deg); } }
  /* Mi jornada (cuenta de recurso) */
  .mj { border-radius:16px; padding:16px; margin-bottom:12px; color:#fff; background: var(--c); box-shadow: 0 8px 20px rgba(2,6,23,.12); }
  .mj .mj-rec { font-size:13px; font-weight:700; opacity:.9; }
  .mj .mj-est { font-size:24px; font-weight:800; margin:4px 0 2px; }
  .mj .mj-sub { font-size:13.5px; opacity:.95; }
  .mj-datos { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-top:12px; }
  .mj-datos div { background: rgba(255,255,255,.16); border-radius:10px; padding:8px 10px; font-size:12px; }
  .mj-datos b { display:block; font-size:15px; margin-top:1px; }
  .btn-xl { width:100%; min-height:58px; font-size:17px; border-radius:14px; border:0; background: linear-gradient(90deg, #15803D, #0F766E); color:#fff; font-weight:800; cursor:pointer; box-shadow: 0 8px 18px rgba(21,128,61,.3); margin-bottom:10px; }
  .btn-xl.azul { background: linear-gradient(90deg, #1D4ED8, #0E7490); box-shadow: 0 8px 18px rgba(29,78,216,.28); }
  .fila-btn { display:flex; gap:8px; margin-bottom:10px; }
  .fila-btn .btn { flex:1; }
  /* Actividades */
  .act { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--borde); cursor:pointer; }
  .act:last-child { border-bottom:0; }
  .act .a-hora { flex:0 0 auto; width:58px; font-size:12px; font-weight:800; color: var(--sub); text-align:right; line-height:1.3; }
  .act .a-cuerpo { flex:1; min-width:0; font-size:14px; }
  .act .a-cuerpo b { font-weight:700; }
  .act .a-cuerpo small { display:block; color: var(--sub); font-size:12px; margin-top:1px; }
  .act-lista { max-height:46vh; overflow-y:auto; border:1px solid var(--borde); border-radius:12px; margin-top:6px; }
  .act-lista button { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--borde); background: var(--card); padding:11px 12px; font:inherit; font-size:14px; cursor:pointer; }
  .act-lista button:last-child { border-bottom:0; }
  .act-lista .g-t { position:sticky; top:0; background: var(--bg); font-size:11.5px; font-weight:800; color: var(--sub); text-transform:uppercase; padding:6px 12px; }
  .act-sel { display:flex; align-items:center; gap:10px; background: color-mix(in srgb, var(--pri2) 10%, white); border:1px solid var(--pri2); border-radius:12px; padding:10px 12px; }
  .act-sel b { flex:1; font-size:15px; }
  .fotos { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .foto { position:relative; width:84px; height:84px; border-radius:10px; overflow:hidden; background: var(--bg); border:1px solid var(--borde); }
  .foto img { width:100%; height:100%; object-fit:cover; display:block; }
  .foto .quitar { position:absolute; top:2px; right:2px; background: rgba(255,255,255,.9); border-radius:50%; width:26px; height:26px; padding:0; font-size:13px; }
  .foto .f-pend { position:absolute; left:0; right:0; bottom:0; background: rgba(120,53,15,.8); color:#fff; font-size:10px; font-weight:700; text-align:center; padding:1px 0; }
  .foto-add { width:84px; height:84px; border-radius:10px; border:2px dashed var(--borde); background: var(--card); font-size:26px; cursor:pointer; }
  .foto-ver { position:fixed; inset:0; z-index:80; background: rgba(2,6,23,.92); display:flex; align-items:center; justify-content:center; }
  .foto-ver img { max-width:100%; max-height:100%; }
  /* v1.2.0 · Formulario de apertura en secciones plegables */
  .tg { border:1px solid var(--borde); border-radius:14px; margin-top:10px; background: var(--card); overflow:hidden; }

/* ───────── Almacenamiento local (IndexedDB): caché de datos y cola de envíos ───────── */
function dbAbrir() {
  return new Promise((ok, mal) => {

async function idb(store, modo, fn) {

    const t = db.transaction(store, modo);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => { db.close(); ok(req ? req.result : undefined); };

async function buscarActualizacion() {

async function aplicarActualizacion(v, manual) {

async function leerTodo(tabla, select, filtro) {
  const out = [];

    let q = sb.from(tabla).select(select).range(d, d + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}

function fundoEnPunto(fc, lat, lng) {

  const enPol = pol => pol.length && enAnillo(pol[0]) && !pol.slice(1).some(enAnillo);
  for (const f of fc.features) {

    const pols = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];

  // Fundos CMPC del área (polígonos): tocar uno marca el punto ahí y elige el fundo; el elegido se resalta
  let capaFundos = null, fundoSel = opts.fundoSel || '';

    return { color: on ? '#F59E0B' : '#FDE68A', weight: on ? 3 : 1.4, fillColor: on ? '#F59E0B' : '#FACC15', fillOpacity: on ? 0.28 : 0.08 }; };
  const setFundos = fc => {

      onEachFeature: (f, ly) => {

        ly.on('click', e => {
          L.DomEvent.stopPropagation(e);
          if (opts.editable) { mover(e.latlng.lat, e.latlng.lng, false); opts.onMove && opts.onMove(e.latlng.lat, e.latlng.lng, f.properties || {}); }
        });
      } }).addTo(map);
    if (pin) pin.setZIndexOffset(1000);
    if (!pin && !hay) { try { map.fitBounds(capaFundos.getBounds(), { padding: [10, 10], maxZoom: 13 }); } catch (e) {} }
  };
  const marcarFundo = cod => { fundoSel = cod || ''; if (capaFundos) capaFundos.setStyle(estiloFundo); };
  if (opts.fundos) setFundos(opts.fundos);

  let capaOtros = null;
  const setOtros = lista => {
    if (capaOtros) { map.removeLayer(capaOtros); capaOtros = null; }

    if (!pts.length) return;

  };
  if (opts.otros) setOtros(opts.otros);

  agregarBuscadorCoord(cont, map, opts.editable ? (la, ln) => { mover(la, ln, true); opts.onMove && opts.onMove(la, ln); } : null);
  const btnG = cont.querySelector('.av-grande'); let marca = null;
  const grande = on => {
    if (on && !cont.classList.contains('grande')) { marca = document.createComment('mapa'); cont.parentNode.insertBefore(marca, cont); document.body.appendChild(cont); }

  const btnL = document.createElement('button'); btnL.type = 'button'; btnL.className = 'av-listo'; btnL.textContent = opts.editable ? '✓ Listo, usar este punto' : '✓ Volver';
  btnL.onclick = e => { e.stopPropagation(); grande(false); }; cont.appendChild(btnL);
  cont.querySelectorAll('.av-capas, .av-grande, .av-listo').forEach(el => L.DomEvent.disableClickPropagation(el));
  setTimeout(() => map.invalidateSize(), 80);
  return { mover, map, setFundos, marcarFundo, setOtros, refrescar: () => { map.invalidateSize(); if (pin) map.panTo(pin.getLatLng()); } };
}

// Miniaturas: las pendientes desde el teléfono; las enviadas con URL firmada (1 h) del bucket privado
async function cargarMiniaturas(fotos) {
  fotos.forEach(f => { if (f.blob) { const img = document.querySelector('[data-foto-img="' + f.id + '"]'); if (img) img.src = URL.createObjectURL(f.blob); } });
  const faltan = fotos.filter(f => f.storage_path && !f.blob && !(S.urlFotos.get(f.storage_path) && S.urlFotos.get(f.storage_path).exp > Date.now()));
  if (faltan.length && navigator.onLine) {
    try {
      const { data, error } = await sb.storage.from(BUCKET_FOTOS).createSignedUrls(faltan.map(f => f.storage_path), 3600);
      if (!error) (data || []).forEach(d => { if (d.signedUrl) S.urlFotos.set(d.path, { url: d.signedUrl, exp: Date.now() + 3500e3 }); });
    } catch (e) { /* sin señal */ }
  }
  fotos.forEach(f => { const u = f.storage_path && S.urlFotos.get(f.storage_path), img = document.querySelector('[data-foto-img="' + f.id + '"]'); if (img && u) img.src = u.url; else if (img && !f.blob) img.alt = navigator.onLine ? 'Foto' : 'Sin señal'; });
}
// Foto comprimida en el teléfono: lado mayor 1600 px, JPEG 0,72 (≈ 200–400 KB)
async function comprimirFoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => mal(new Error('No se pudo leer la foto')); i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.72));
    if (!blob) throw new Error('No se pudo comprimir la foto');
    return { blob, ancho: w, alto: h, bytes: blob.size };
  } finally { URL.revokeObjectURL(url); }
}

async function accionSimple(tipo) {

  const txt = tipo === 'eliminar' ? '¿Eliminar esta apertura? Queda respaldada en la auditoría, pero desaparece de la Bitácora.' : '¿Reabrir la jornada? El recurso podrá volver a corregirla hasta el cierre automático.';
  if (!confirm(txt)) return;
  try {
    const res = await ejecutar(tipo, j.id, { p_id: j.id });
    cerrarHoja(); toast(res === 'cola' ? '📵 Guardado en el teléfono' : (tipo === 'eliminar' ? '🗑️ Apertura eliminada' : '🔓 Jornada reabierta')); pintar();
  } catch (e) { toast('No se pudo: ' + msgError(e), 5000); }
}

/* ───────── Envío al servidor y cola sin señal ───────── */
async function enviar(tipo, payload) {
  let r;
  if (tipo === 'guardar') r = await sb.rpc('bit_guardar_jornada', { p: payload });
  else if (tipo === 'cerrar') r = await sb.rpc('bit_cerrar_jornada', payload);
  else if (tipo === 'reabrir') r = await sb.rpc('bit_reabrir_jornada', payload);
  else if (tipo === 'eliminar') r = await sb.rpc('bit_eliminar_jornada', payload);
  else if (tipo === 'actividad') r = await sb.rpc('bit_guardar_actividad', { p: payload });
  else if (tipo === 'favorito') r = await sb.rpc('bit_favorito', payload);
  else if (tipo === 'eliminar_act') {
    r = await sb.rpc('bit_eliminar_actividad', { p_id: payload.p_id });
    if (!r.error && r.data && (r.data.fotos || []).length) { try { await sb.storage.from(BUCKET_FOTOS).remove(r.data.fotos); } catch (e) { /* el archivo queda; lo limpia el Administrador */ } }
  } else if (tipo === 'foto') {
    // 1) archivo al bucket (si ya estaba de un intento anterior, sigue) 2) fila en bit_foto
    const ruta = payload.recurso_id + '/' + payload.fecha_operativa + '/' + payload.registro_id + '/' + payload.id + '.jpg';
    const up = await sb.storage.from(BUCKET_FOTOS).upload(ruta, payload.blob, { contentType: 'image/jpeg', upsert: false });
    if (up.error && !/exist|duplicate|409/i.test(msgError(up.error) + ' ' + (up.error.statusCode || ''))) throw up.error;
    r = await sb.rpc('bit_registrar_foto', { p: { id: payload.id, registro_id: payload.registro_id, storage_path: ruta, bytes: payload.bytes, ancho: payload.ancho, alto: payload.alto, tomada_en: payload.tomada_en } });
  }
  if (r.error) throw r.error;
  return r.data;
}
function aplicarRespuesta(tipo, jid, fila) {
  if (tipo === 'favorito') { if (Array.isArray(fila)) { S.favs = new Set(fila); cacheSet('favs', fila); } return; }
  if (tipo === 'actividad' || tipo === 'foto' || tipo === 'eliminar_act') {
    if (tipo === 'eliminar_act') S.actividades = S.actividades.filter(x => x.id !== jid);
    else if (fila && fila.id) { S.actividades = S.actividades.filter(x => x.id !== fila.id); S.actividades.push(fila); }
    cacheSet('actividades', { lista: S.actividades, desde: S.actDesde, sin: S.sinActividades });
    return;
  }
  if (tipo === 'eliminar') S.jornadas = S.jornadas.filter(x => x.id !== jid);
  else if (fila && fila.id) {
    S.jornadas = S.jornadas.filter(x => x.id !== jid && x.id !== fila.id && !(x.recurso_id === fila.recurso_id && x.fecha_operativa === fila.fecha_operativa));
    S.jornadas.push(fila);
  }
  cacheSet('jornadas', { lista: S.jornadas, desde: S.desde, fecha: S.descarga });
}
// Con señal y sin nada pendiente de ese registro (ni de aquel del que depende: la jornada de una actividad, la actividad
// de una foto): se envía al tiro. Si no, va a la cola (respeta el orden).
async function ejecutar(tipo, jid, payload, dep) {
  await refrescarPendientes();
  const enCola = S.pendientes.some(p => p.jid === jid || (dep && p.jid === dep));
  if (navigator.onLine && !enCola) {
    try { const fila = await enviar(tipo, payload); aplicarRespuesta(tipo, jid, fila); return 'ok'; }
    catch (e) { if (!esSinSenal(e)) throw e; }
  }
  await colaAgregar({ tipo, jid, payload, creado: new Date().toISOString(), intentos: 0, error: '' });
  await refrescarPendientes();
  if (navigator.onLine) setTimeout(sincronizarPendientes, 300);
  return 'cola';
}
async function sincronizarPendientes() {
  if (S.sincronizando || !navigator.onLine) return;
  await refrescarPendientes();
  if (!S.pendientes.length) return;
  S.sincronizando = true;
  let enviados = 0, conError = 0;
  const renombre = new Map();   // id del teléfono → id que quedó en el servidor (otro equipo abrió primero)
  for (const it0 of S.pendientes) {
    const it = Object.assign({}, it0);
    it.payload = Object.assign({}, it0.payload);
    if (renombre.has(it.jid)) { const nid = renombre.get(it.jid); it.jid = nid; if (it.payload.p_id) it.payload.p_id = nid; if (it.payload.id) it.payload.id = nid; }
    if (it.payload.jornada_id && renombre.has(it.payload.jornada_id)) it.payload.jornada_id = renombre.get(it.payload.jornada_id);   // actividad de una jornada que otro equipo abrió primero
    try {
      const fila = await enviar(it.tipo, it.payload);
      if (it.tipo === 'guardar' && fila && fila.id && fila.id !== it.jid) renombre.set(it0.jid, fila.id);
      aplicarRespuesta(it.tipo, it.jid, fila);
      await colaQuitar(it.id); enviados++;
    } catch (e) {
      if (esSinSenal(e)) break;
      conError++;
      await colaActualizar(Object.assign({}, it, { intentos: (it.intentos || 0) + 1, error: msgError(e) }));
    }
  }
  S.sincronizando = false;
  await refrescarPendientes();
  if (enviados) toast('✅ ' + enviados + ' envío(s) pendiente(s) enviado(s)' + (conError ? ' · ⚠️ ' + conError + ' con error (ver Mi cuenta)' : ''));
  else if (conError) toast('⚠️ ' + conError + ' envío(s) rechazado(s): revisa Mi cuenta', 4500);
  if (!$('ov').classList.contains('show')) pintar();
}

/* ───────── Eventos ───────── */
document.addEventListener('DOMContentLoaded', async () => {

    if (t.closest('[data-instalar]')) return instalarApp();
    const hd = t.closest('[data-hdias]'); if (hd) { S.hist.dias = Number(hd.dataset.hdias); return pintar(); }
    const k = t.closest('[data-kpi]'); if (k) { e.preventDefault(); S.filtros.kpi = S.filtros.kpi === k.dataset.kpi ? '' : k.dataset.kpi; return pintar(); }

    const ap = t.closest('[data-abrir-ap]'); if (ap) { const r = recurso(ap.dataset.abrirAp); if (r) abrirFormulario(r, ap.dataset.f, null); return; }
    const ea = t.closest('[data-editar-ap]'); if (ea) { const r = recurso(ea.dataset.editarAp), j = r && jornadaDe(r.id, ea.dataset.f); if (r && j) abrirFormulario(r, ea.dataset.f, j); return; }
    const ci = t.closest('[data-cerrarj-ini]'); if (ci) { const r = recurso(ci.dataset.cerrarjIni), j = r && jornadaDe(r.id, ci.dataset.f); if (r && j) { S.hoja = { r, f: ci.dataset.f, j }; abrirCierre(); } return; }
    const an = t.closest('[data-act-nueva]'); if (an) { const j = [...S.jIdx.values()].find(x => x.id === an.dataset.actNueva), r = j && recurso(j.recurso_id); if (r) abrirActividad(r, j, null, null); return; }
    const av = t.closest('[data-act]'); if (av) return verActividad(av.dataset.act, null);
    if (t.closest('[data-olvidar]')) return olvidarClave();
    const rc = t.closest('[data-rec]'); if (rc) { if (S.mapaTab) S.mapaTab.closePopup(); return abrirRecurso(rc.dataset.rec, rc.dataset.f || S.fecha); }
    if (t.closest('[data-recargar]')) { S.errorCarga = ''; return cargarTodo(); }
    if (t.closest('[data-sync]')) return sincronizarPendientes();
    if (t.closest('[data-salir]')) return salir();
    const ds = t.closest('[data-descartar]');
    if (ds) { if (confirm('¿Descartar este envío pendiente? No llegará al servidor.')) { await colaQuitar(Number(ds.dataset.descartar)); await refrescarPendientes(); pintar(); } return; }
    if (t.closest('[data-buscar-version]')) {
      if (!navigator.onLine) { avisoPendienteOffline(); return toast('📵 Sin señal: se buscará al recuperar la conexión'); }
      toast('🔎 Buscando versión nueva…');
      await buscarActualizacion();
      if (!S.versionNueva || cmpVersion(S.versionNueva, APP_VERSION) <= 0) toast('✅ Tienes la última versión (v' + APP_VERSION + ')');
    }
  });
  cuerpo.addEventListener('change', e => {
    if (e.target.id === 'h-rec') { S.hist.rid = e.target.value; return pintar(); }
    const m = { 'f-area': 'area', 'f-tipo': 'tipo' }[e.target.id];
    if (m) { S.filtros[m] = e.target.value; pintar(); }
  });
  let esp = null;
  cuerpo.addEventListener('input', e => { if (e.target.id !== 'f-q') return; clearTimeout(esp); esp = setTimeout(() => { S.filtros.q = e.target.value; pintar(); const q = $('f-q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 300); });

  // Hoja (ficha / formulario)
  const hoja = $('sheet');
  hoja.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-cerrar]')) return cerrarHoja();
    if (t.closest('[data-editar]')) { const { r, f, j } = S.hoja; return abrirFormulario(r, f, j); }
    if (t.closest('[data-cerrarj]')) return abrirCierre();
    if (t.closest('[data-volver]')) { const { r, f } = S.hoja; return abrirRecurso(r.id, f); }
    const cok = t.closest('[data-cerrar-ok]'); if (cok) return confirmarCierre(cok);
    if (t.closest('[data-reabrir]')) return accionSimple('reabrir');
    if (t.closest('[data-eliminar]')) return accionSimple('eliminar');
    // Actividades desde la ficha de la apertura (vuelven a la ficha al terminar)
    const fv = t.closest('[data-foto-ver]'); if (fv) { const img = fv.querySelector('img'); return verFotoGrande(img && img.src); }
    const an = t.closest('[data-act-nueva]');
    if (an && !F) { const { r, f, j } = S.hoja; return abrirActividad(r, j, null, { rid: r.id, f }); }
    const av = t.closest('[data-act]');
    if (av && !F) { const { r, f } = S.hoja; return verActividad(av.dataset.act, { rid: r.id, f }); }
    if (t.closest('[data-act-volver-ficha]')) { const v = S.verAct && S.verAct.volver; cerrarHoja(); if (v) abrirRecurso(v.rid, v.f); return; }
    if (!F) return;
    // Comunes a la apertura y a la actividad: fundo (buscar / elegir / cambiar)
    const tgC = t.closest('[data-tg]'); if (tgC) { if (F.modo === 'actividad') leerCamposAct(); else leerCamposForm(); resumenForm(); return abrirSeccion(tgC.dataset.tg); }
    if (t.closest('[data-coord-man]')) { F.coordMan = true; pintarCoordMan(); const x = $('cm-lag'); if (x) x.focus(); return; }
    if (t.closest('[data-coord-no]')) { F.coordMan = false; return pintarCoordMan(); }
    if (t.closest('[data-coord-ok]')) return usarCoordMan();
    const fs = t.closest('[data-fu-sel]'); if (fs) { leerCamposForm(); return elegirFundo(fs.dataset.fuSel); }
    if (t.closest('[data-fu-cambiar]')) { leerCamposForm(); F.cod_fundo = ''; F.fundo_nombre = ''; F.fundoManual = true; F.fq = ''; if (F.mapa) F.mapa.marcarFundo(''); pintarFundo(); const q = $('ff-fq'); if (q) q.focus(); return; }
    if (F.modo === 'actividad') {
      if (t.closest('[data-act-volver]')) { const v = F.volver; F.fotosNuevas.forEach(x => URL.revokeObjectURL(x.url)); cerrarHoja(); if (v) abrirRecurso(v.rid, v.f); return; }
      if (t.closest('[data-act-eliminar]')) return eliminarActividad();
      if (t.closest('[data-act-cambiar]')) { leerCamposAct(); F.buscando = true; F.grupo = (actCat(F.actividad) || {}).grupo_codigo || ''; F.clasif = clasifDeGrupo(F.grupo); return pintarSelAct(); }
      const as = t.closest('[data-act-sel]'); if (as) { leerCamposAct(); F.actividad = as.dataset.actSel; F.buscando = false; F.q = ''; pintarSelAct(); return pintarCant(); }
      const fv = t.closest('[data-fav]'); if (fv) return alternarFavorita(fv.dataset.fav);
      const kl = t.closest('[data-clasif]'); if (kl) {
        F.clasif = kl.dataset.clasif; F.q = ''; F.grupo = '';
        const gs = [...new Set(habilitadas(F.r).filter(a => clasifDeGrupo(a.grupo_codigo) === F.clasif).map(a => a.grupo_codigo))];
        if (gs.length === 1) F.grupo = gs[0];   // un solo grupo: directo a sus actividades
        return pintarSelAct();
      }
      if (t.closest('[data-clasif-volver]')) { F.clasif = ''; F.grupo = ''; F.q = ''; return pintarSelAct(); }
      const gr = t.closest('[data-grupo]'); if (gr) { F.grupo = gr.dataset.grupo; F.q = ''; return pintarSelAct(); }
      if (t.closest('[data-grupo-volver]')) { F.grupo = ''; F.q = ''; return pintarSelAct(); }
      if (t.closest('[data-ahora]')) { const ci = new Date(F.j.cierre_programado), ah = new Date(); F.fin = hhmm(ah < ci ? ah : ci); if ($('fa-fin')) $('fa-fin').value = F.fin; return pintarDur(); }
      if (t.closest('[data-fin-turno]')) { const av = avanceDe(F.j); if (av) { F.fin = hhmm(av.fin); if ($('fa-fin')) $('fa-fin').value = F.fin; } return pintarDur(); }
      if (t.closest('[data-foto-add]')) { const inp = $('fa-foto'); if (inp) { inp.value = ''; inp.click(); } return; }
      const fq = t.closest('[data-foto-quitar]'); if (fq) { const x = F.fotosNuevas.splice(Number(fq.dataset.fotoQuitar), 1)[0]; if (x) URL.revokeObjectURL(x.url); return pintarFotos(); }
      if (t.closest('[data-gps]')) return usarGps(false);
      const ga = t.closest('[data-guardar]'); if (ga) return guardarActividad(ga);
      return;
    }

    const es = t.closest('[data-estado]');
    if (es) {
      if (F.tieneAct && es.dataset.estado !== F.estado) return toast('Esta apertura ya tiene actividades: el estado no se puede cambiar.', 4000);
      leerCamposForm(); const antes = estadoCat(F.estado); F.estado = es.dataset.estado; const ahora = estadoCat(F.estado); pintarFormulario(); if (ahora && ahora.en_servicio && !(antes && antes.en_servicio) && F.lat == null) usarGps(true); return;
    }
    if (t.closest('[data-repetir]')) { leerCamposForm(); const ref = F.ref; return abrirFormulario(F.r, F.fecha_operativa, null, ref); }

    const tu = t.closest('[data-turno]'); if (tu) { if (F.tieneAct) return toast('Esta apertura ya tiene actividades: el turno no se puede cambiar.', 4000); F.turno = tu.dataset.turno; F.jt = (turnoCat(F.turno) || {}).jornada || F.jt; return pintarTurno(); }
    const fo = t.closest('[data-foco]'); if (fo) { F.foco = F.foco === fo.dataset.foco ? '' : fo.dataset.foco; return pintarFoco(); }
    const je = t.closest('[data-jefe]');
    if (je) { const i = Number(je.dataset.jefe), on = !F.dot[i].es_jefe; F.dot.forEach(p => { p.es_jefe = false; }); F.dot[i].es_jefe = on; if (on) F.dot[i].presente = true; return pintarDot(); }
    const qu = t.closest('[data-quitar]'); if (qu) { F.dot.splice(Number(qu.dataset.quitar), 1); return pintarDot(); }

    if (t.closest('[data-agregar-no]')) { F.agregando = false; return pintarDot(); }

  });
  hoja.addEventListener('change', async e => {
    if (!F) return;
    const t = e.target;
    if (t.id === 'fa-foto' && t.files && t.files[0]) {
      if (F.fotos.length + F.fotosNuevas.length >= 6) return toast('Hasta 6 fotos por actividad');
      try { const fo = await comprimirFoto(t.files[0]); if (!F) return; fo.url = URL.createObjectURL(fo.blob); fo.tomada_en = new Date().toISOString(); F.fotosNuevas.push(fo); pintarFotos(); }
      catch (err) { toast(msgError(err)); }

    if (t.id === 'fa-fin') { leerCamposAct(); return pintarDur(); }
    if (t.dataset.pres != null) { const p = F.dot[Number(t.dataset.pres)]; p.presente = t.checked; if (!t.checked) p.es_jefe = false; return pintarDot(); }
    if (t.id === 'fa-rut' && t.value) { if (rutValido(t.value)) t.value = rutFormato(t.value); return; }
    if (t.id === 'ff-cambio') { leerCamposForm(); return resumenForm(); }
  });
  let espAct = null, espFu = null;
  hoja.addEventListener('input', e => {
    const t = e.target;
    if (!F) return;
    if (/^cm-(la|ln)[gm]$/.test(t.id)) { t.value = t.value.replace(/\D/g, ''); if (t.value.length >= 2) { const sig = { 'cm-lag': 'cm-lam', 'cm-lam': 'cm-las', 'cm-lng': 'cm-lnm', 'cm-lnm': 'cm-lns' }[t.id]; if ($(sig)) $(sig).focus(); } return; }

    if (F.modo !== 'actividad') return;

    espAct = setTimeout(() => { if (!F) return; F.q = t.value; pintarSelAct(); const q = $('fa-q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 250);
  });
  $('ov').addEventListener('click', e => { if (e.target.id === 'ov' && !F) cerrarHoja(); });

  window.addEventListener('online', pintarRed);
  window.addEventListener('offline', pintarRed);
  window.addEventListener('online', async () => { toast('🟢 Conexión recuperada: enviando pendientes'); try { await sincronizarPendientes(); } catch (e) {} buscarActualizacion(); if (!$('ov').classList.contains('show')) pintar(); });
  window.addEventListener('offline', () => { toast('🔴 Sin señal: las aperturas se guardarán en el teléfono'); avisoPendienteOffline(); if (!$('ov').classList.contains('show')) pintar(); });

    if (document.visibilityState !== 'visible') return;
    buscarActualizacion(); if (navigator.onLine) sincronizarPendientes();

  setInterval(() => { revisarAlertas(); if (S.sec === 'inicio' && S.ctx && !$('ov').classList.contains('show')) pintar(); }, 60 * 1000);
  setInterval(buscarActualizacion, ACT_CADA_MS);
  setInterval(() => { if (navigator.onLine) sincronizarPendientes(); }, 5 * 60 * 1000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-bitacora.js').catch(() => {});
  buscarActualizacion();
  const { data } = await sb.auth.getSession();
  if (data && data.session) await mostrarApp();
  else {
    $('v-login').style.display = '';
    // Sesión vencida o cerrada con la clave recordada: vuelve a entrar sola (con señal)
    if (claveGuardada() && $('l-mail').value && navigator.onLine) entrar();
  }
});
