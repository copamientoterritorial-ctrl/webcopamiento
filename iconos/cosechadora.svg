<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 44" width="64" height="44">
  <!-- Cosechadora forestal (harvester): ruedas, chasis, cabina, grúa y cabezal con un tronco. Punto de Faena (SQL 174). -->
  <g stroke="#1F2937" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- tronco tomado por el cabezal -->
    <rect x="47" y="30" width="15" height="5" rx="2.5" fill="#A16207"/>
    <ellipse cx="62" cy="32.5" rx="1.6" ry="2.5" fill="#FDE68A"/>
    <!-- grúa (brazo y pluma) -->
    <path d="M30 18 L42 7 L54 14" fill="none" stroke="#1F2937" stroke-width="4.4"/>
    <path d="M30 18 L42 7 L54 14" fill="none" stroke="#F59E0B" stroke-width="2.6"/>
    <line x1="54" y1="14" x2="54" y2="25" stroke="#374151" stroke-width="2"/>
    <!-- cabezal cosechador -->
    <path d="M49 24 H59 V31 H49 Z" fill="#F59E0B"/>
    <path d="M50 31 L48 35 M58 31 L60 35" fill="none"/>
    <!-- chasis -->
    <path d="M3 26 H40 V32 H3 Z" fill="#F59E0B"/>
    <rect x="5" y="20" width="10" height="6" fill="#D97706"/>
    <!-- cabina -->
    <path d="M17 26 V12 H30 L33 18 V26 Z" fill="#F59E0B"/>
    <path d="M19 14 H28.5 L31 19 H19 Z" fill="#BAE6FD"/>
    <!-- ruedas (bogie) -->
    <circle cx="9" cy="36" r="6" fill="#111827"/>
    <circle cx="9" cy="36" r="2.2" fill="#9CA3AF"/>
    <circle cx="23" cy="36" r="6" fill="#111827"/>
    <circle cx="23" cy="36" r="2.2" fill="#9CA3AF"/>
    <circle cx="35" cy="36" r="6" fill="#111827"/>
    <circle cx="35" cy="36" r="2.2" fill="#9CA3AF"/>
  </g>
</svg>
