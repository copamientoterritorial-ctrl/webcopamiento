<style>

  /* Tema SIEMPRE claro (10-11-2026): aunque el teléfono esté en modo oscuro, la app se ve igual que en el simulador. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); }

  header .btn-w { flex:0 0 auto; min-width:44px; min-height:40px; }

  .btn { border:0; border-radius:10px; padding:11px 14px; font:inherit; font-weight:700; cursor:pointer; background: var(--card); color: var(--txt); border:1px solid var(--borde); }
  .btn-p { background: var(--azul2); color:#fff; border-color: var(--azul2); }

  .muted { color: var(--sub); font-size:12px; }

  nav.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  nav.tabs button { flex:0 0 auto; border:1px solid var(--borde); background: var(--card); color: var(--txt); border-radius:999px; padding:7px 12px; font:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  nav.tabs button.on { background: var(--azul); color:#fff; border-color: var(--azul); }

  .err { background:#FEE2E2; color:#7F1D1D; }

  .login { position:fixed; inset:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 15% 10%, #2563EB 0%, transparent 50%), linear-gradient(160deg, #1E3A8A 0%, #0F766E 100%); z-index:20; }
  .lg-card { width:100%; max-width:380px; background: var(--card); border-radius:22px; padding:26px 22px 20px; box-shadow: 0 24px 60px rgba(2,6,23,.35); }
  .lg-logo { display:block; width:80px; height:80px; margin:0 auto 10px; border-radius:20px; box-shadow: 0 8px 20px rgba(2,6,23,.25); }

  .row-foot { display:flex; justify-content:center; margin-top:10px; }
  .pend-item { border-top:1px solid var(--borde); padding:9px 0; font-size:13px; }
  .pend-err { color: var(--err); font-size:12px; margin-top:3px; }

  .rg-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:2px; }
  .rg-obs { margin:6px 0; padding:8px 10px; background: var(--bg); border-radius:10px; }

  .av-modo { font-size:12px; font-weight:700; color: var(--azul2); background: color-mix(in srgb, var(--azul2) 10%, transparent); padding:6px 10px; border-radius:10px; margin-top:8px; }
  /* Actualización de datos: contenido tenue hasta terminar, con aviso y el ícono girando */
  body.cargando #m-cuerpo { opacity:.4; pointer-events:none; transition: opacity .2s ease; }
  body.cargando #h-actualizar { animation: giro 1s linear infinite; }
  body.cargando::after { content:'⟳  Actualizando datos…'; position:fixed; top:68px; left:50%; transform:translateX(-50%); background:#0F172A; color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:25; box-shadow: 0 12px 28px rgba(2,6,23,.35); white-space:nowrap; }
  .toast-msg { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); max-width:calc(100% - 32px); background:#0F172A; color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; font-weight:700; text-align:center; box-shadow: 0 12px 28px rgba(2,6,23,.35); z-index:30; animation: toastIn .25s ease; }
  @keyframes toastIn { from { opacity:0; transform: translate(-50%, 12px); } to { opacity:1; transform: translate(-50%, 0); } }
  @keyframes giro { to { transform: rotate(360deg); } }
  /* Formulario Registrar avance: encabezado y pie fijos, solo el cuerpo se desplaza */
  #av-sheet.sheet { padding:0; display:flex; flex-direction:column; max-height:86vh; overflow:hidden; border-radius:20px; width:calc(100% - 24px); margin:0 12px 12px; box-sizing:border-box; }
  .av-top { display:flex; gap:10px; align-items:flex-start; padding:14px 16px 12px; border-bottom:1px solid var(--borde); flex:0 0 auto; }
  .av-grupo { display:inline-block; font-size:11px; font-weight:700; color: var(--azul2); background: color-mix(in srgb, var(--azul2) 12%, transparent); padding:2px 9px; border-radius:999px; margin-bottom:5px; }
  .av-accion { font-size:15px; font-weight:700; margin:0; line-height:1.3; }
  .av-meta { font-size:11.5px; color: var(--sub); margin-top:3px; }
  .av-x { border:0; background: var(--bg); color: var(--sub); width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer; flex:0 0 auto; }
  .av-body { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:12px 16px; }
  .av-avance { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; }
  .av-fila2 { display:grid; grid-template-columns: 1fr 1.5fr; gap:10px; }
  .av-fila2 input { height:40px; padding:8px 10px; }
  .av-body label { margin-top:10px; }
  .av-nuevo { font-size:11.5px; margin-top:4px; }
  .av-adj { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .av-btn { border:1px solid var(--borde); background: var(--card); color: var(--txt); border-radius:10px; padding:9px 8px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .av-btn:active { background: var(--bg); }
  .av-arch { font-size:12px; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .av-quitar { border:0; background:transparent; color: var(--err); font-weight:800; cursor:pointer; padding:0 4px; }
  .av-mapa { position:relative; height:160px; border-radius:12px; overflow:hidden; border:1px solid var(--borde); background: var(--bg); display:flex; align-items:center; justify-content:center; }
  .av-mapa img { width:100%; height:100%; object-fit:cover; display:block; }
  .av-mapa .av-base, .av-mapa .av-relieve { position:absolute; left:0; top:0; width:100%; height:100%; object-fit:cover; display:block; }
  .av-mapa .av-relieve { mix-blend-mode:multiply; opacity:.45; }

  .av-mapa-in { position:absolute; inset:0; }
  .av-capas { position:absolute; top:8px; right:8px; display:flex; background: rgba(255,255,255,.94); border-radius:999px; padding:3px; box-shadow: 0 2px 8px rgba(2,6,23,.3); z-index:2; }
  .av-capas button { border:0; background:none; color:#0F172A; font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; min-height:32px; }
  .av-capas button.on { background: var(--azul2); color:#fff; }
  .av-pin { position:absolute; left:50%; top:50%; width:26px; height:34px; transform: translate(-50%, -100%); filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); pointer-events:none; }
  .av-cap { position:absolute; left:8px; bottom:8px; background: rgba(15,23,42,.72); color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; pointer-events:none; }
  .av-geo-row { display:flex; gap:8px; align-items:center; margin-top:8px; flex-wrap:wrap; font-size:12px; }
  .av-geo-row .av-btn { flex:0 0 auto; }
  .av-hist { margin-top:12px; font-size:12px; }
  .av-hist summary { cursor:pointer; font-weight:700; color: var(--sub); padding:6px 0; }
  .av-foot { flex:0 0 auto; padding:10px 16px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--borde); background: var(--card); }
  .av-guardar { width:100%; height:46px; border-radius:12px; font-size:15px; border:0; background: linear-gradient(90deg, #2563EB, #0F766E); box-shadow: 0 8px 18px rgba(37,99,235,.28); }
  .perfil-head { display:flex; gap:12px; align-items:center; }
  .avatar { width:56px; height:56px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:19px; color:#fff; background: linear-gradient(135deg, #2563EB, #0F766E); }
  .fila-dato { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-bottom:1px solid var(--borde); font-size:14px; }
  .fila-dato:last-child { border-bottom:0; }
  .pill { display:inline-block; padding:4px 10px; border-radius:999px; background: var(--borde); font-size:12px; font-weight:700; margin:2px 3px 2px 0; }
  /* Desplazamiento: suave, barra discreta y espacio libre sobre el menú inferior */
  html { scroll-behavior: smooth; scroll-padding-top: 72px; -webkit-text-size-adjust: 100%; }
  * { scrollbar-width: thin; scrollbar-color: var(--borde) transparent; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  .pct { display:inline-block; min-width:40px; text-align:center; padding:1px 7px; border-radius:999px; font-size:11px; font-weight:700; color: var(--c, #94A3B8); background: color-mix(in srgb, var(--c, #94A3B8) 13%, transparent); white-space:nowrap; }

<body>

<!-- ───────── Login ───────── -->
<section id="v-login" class="login" style="display:none;">
  <div class="lg-card">
    <img class="lg-logo" src="icon-192.png" alt="Prevención Territorial">
    <h1 class="lg-titulo">Prevención Territorial</h1>
    <p class="lg-sub">Ingresa con tu correo y clave de la plataforma</p>
    <label for="l-mail">Correo</label>
    <div class="lg-input"><span class="ic">✉️</span><input id="l-mail" type="email" autocomplete="username" placeholder="nombre@empresa.cl"></div>
    <label for="l-clave">Clave</label>
    <div class="lg-input"><span class="ic">🔒</span><input id="l-clave" type="password" autocomplete="current-password" placeholder="Tu clave"></div>
    <label class="lg-check"><input type="checkbox" id="l-recordar" checked><span>Recordar mi correo y mantener la sesión en este equipo</span></label>
    <div class="lg-nota">Por seguridad la clave no se guarda en la app. Si el navegador te ofrece guardarla, acepta.</div>

    <button class="btn btn-p lg-btn" id="l-entrar">Ingresar</button>
    <div class="lg-pie">Acceso restringido · Uso interno</div>
  </div>
</section>

<!-- ───────── App ───────── -->
<div id="v-app" style="display:none;">
  <header>
    <div style="flex:1;">
      <h1 id="h-titulo">📋 PPA</h1>
      <small id="h-sub">Plan de Prevención por Área</small>
    </div>
    <button class="btn btn-w" id="h-actualizar" title="Actualizar datos">🔄</button>
    <button class="btn btn-w" id="h-salir" title="Cerrar sesión">⏻</button>

</div>

<!-- ───────── Registrar avance ───────── -->
<div class="overlay" id="ov-avance">
  <div class="sheet" id="av-sheet"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Clave pública (anon): por diseño es pública; el acceso real lo controla RLS (SQL 130–164).
const SUPABASE_URL = 'https://dgcnshdmmnjvucdkzpqb.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnY25zaGRtbW5qdnVjZGt6cHFiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTE2MjMsImV4cCI6MjEwMjI4NzYyM30.NmleQocIOF6XLsBySnh8sMEKpFhx5MSHZJNDacLZvkY';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'sig-prevencion-app', detectSessionInUrl: false } });
const EVID_BUCKET = 'ppa-evidencias', EVID_MAX = 20 * 1024 * 1024;
const TIPOS_OK = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'application/pdf'];

const S = { ppa: [], avances: [], filtros: { subg: '', area: '', sector: '', grupo: '', q: '' }, vista: 'tablero', sec: 'meteo', solo: false, ultimaDescarga: null, filAbierto: false, areaDefault: '', defaultAplicado: false, grupoAbierto: '', esAdmin: false, puedeElegirArea: true, meteo: { cargando: false, error: '', pos: null, datos: null, hora: null }, pendientes: [], sincronizando: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => Math.round((Number(v) || 0) * 100) / 100;
const pct = (a, m) => m > 0 ? Math.round(a / m * 100) : null;
const colorPct = p => p == null ? '#94A3B8' : p >= 100 ? '#16A34A' : p >= 50 ? '#D97706' : '#DC2626';
const fmtFecha = iso => { if (!iso) return '—'; const p = String(iso).slice(0, 10).split('-'); return p[2] + '-' + p[1] + '-' + p[0]; };
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function toast(m) { const t = document.createElement('div'); t.className = 'toast-msg'; t.setAttribute('role', 'status'); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }

/* ───────── Sesión ───────── */
async function entrar() {
  const mail = $('l-mail').value.trim(), clave = $('l-clave').value;
  $('l-err').style.display = 'none';
  if (!mail || !clave) { $('l-err').textContent = 'Escribe correo y clave.'; $('l-err').style.display = ''; return; }
  $('l-entrar').disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: mail, password: clave });

async function leerTodo(tabla, select, filtro) {
  const out = [];
  for (let d = 0; ; d += 1000) {
    let q = sb.from(tabla).select(select).range(d, d + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;
  }
  return out;
}
// Datos del PPA: se guardan en el teléfono; sin señal se muestran los últimos datos guardados
async function cargarDatos() {
  try {
    S.ppa = await leerTodo('v_ppa', '*', q => q.order('id_ppa'));
    S.avances = await leerTodo('ppa_avances', 'id, id_ppa, fecha, cantidad, observacion, evidencia_ruta, evidencia_nombre, evidencia_tipo, origen, mes, quincena, creado_en');
    S.ultimaDescarga = new Date();
    cacheSet('ppa', { ppa: S.ppa, avances: S.avances, fecha: new Date().toISOString() });
    if (!S.defaultAplicado) await aplicarFiltroPorDefecto();
  } catch (e) {
    const c = await cacheGet('ppa');
    if (c && c.ppa) { S.ppa = c.ppa; S.avances = c.avances || []; toast('📵 Sin señal: datos guardados del ' + fmtFecha(c.fecha)); }
    else toast('No se pudieron cargar los datos: ' + (e.message || e));
  }
}

function gruposDe(lista) {
  const m = new Map();

    if (!m.has(k)) m.set(k, { id: k, nombre: a.grupo || 'Sin grupo', acciones: [] });

  return [...m.values()].map(g => {
    g.meta = g.acciones.reduce((s, a) => s + (Number(a.meta_general) || 0), 0);
    g.av = g.acciones.reduce((s, a) => s + avanceTotal(a.id_ppa), 0);

/* ───────── Meteorología: tablero del pronóstico en la ubicación GPS del teléfono ───────── */
// Misma lógica que el módulo meteorológico del sistema (riesgo de incendio por temperatura, humedad y viento; puelche; Open-Meteo)
const MR_COLOR = { bajo: '#16A34A', moderado: '#F59E0B', alto: '#EA580C', extremo: '#DC2626' };
const MR_ETIQ = { bajo: 'BAJO', moderado: 'MODERADO', alto: 'ALTO', extremo: 'EXTREMO' };
const MR_ORDEN = { bajo: 0, moderado: 1, alto: 2, extremo: 3 };
function mrRiesgo(temp, hum, viento) {
  temp = temp || 0; hum = hum == null ? 50 : hum; viento = viento || 0;
  let s = 0;
  if (temp >= 30) s += 3; else if (temp >= 25) s += 2; else if (temp >= 20) s += 1;
  if (hum <= 20) s += 3; else if (hum <= 30) s += 2; else if (hum <= 40) s += 1;
  if (viento >= 40) s += 3; else if (viento >= 25) s += 2; else if (viento >= 15) s += 1;
  const nivel = s >= 7 ? 'extremo' : s >= 5 ? 'alto' : s >= 3 ? 'moderado' : 'bajo';
  return { nivel, etiqueta: MR_ETIQ[nivel], color: MR_COLOR[nivel] };
}
function mrCielo(wc) {
  if (wc == null) return ['🌤️', 'Variable'];
  if (wc >= 95) return ['⛈️', 'Tormentas'];
  if (wc >= 85 || (wc >= 71 && wc <= 77)) return ['🌨️', 'Nieve'];
  if (wc >= 80) return ['🌦️', 'Chubascos'];
  if (wc >= 61) return ['🌧️', 'Lluvia'];
  if (wc >= 51) return ['🌦️', 'Llovizna'];
  if (wc >= 45) return ['🌫️', 'Niebla'];
  if (wc === 3) return ['🌥️', 'Nublado'];
  if (wc >= 1) return ['🌤️', 'Parcial'];
  return ['☀️', 'Despejado'];
}
function mrDir(deg) { return deg == null ? '—' : ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'][Math.round(deg / 22.5) % 16]; }
const mrDiaCorto = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: '2-digit', month: '2-digit' });
// Análisis de un día: riesgo de la hora más crítica, franja de riesgo alto, puelche y datos diarios
function mrDia(m, i) {
  const h = m.hourly, d = m.daily, dia = d.time[i], horas = [];
  h.time.forEach((t, j) => { if (t.slice(0, 10) === dia) horas.push(j); });
  let peor = null, kMax = -1e9, franja = [], pue = 0;
  horas.forEach(j => {
    const r = mrRiesgo(h.temperature_2m[j], h.relative_humidity_2m[j], h.wind_speed_10m[j]);
    const k = MR_ORDEN[r.nivel] * 100 + (h.temperature_2m[j] || 0) + (h.wind_speed_10m[j] || 0) - (h.relative_humidity_2m[j] || 0) / 2;
    if (k > kMax) { kMax = k; peor = { j, r }; }
    if (r.nivel === 'alto' || r.nivel === 'extremo') franja.push(j);
    const dd = h.wind_direction_10m[j], vv = h.wind_speed_10m[j] || 0, hh = h.relative_humidity_2m[j];
    if (dd != null && dd >= 45 && dd <= 135 && vv >= 12 && hh != null && hh <= 45) pue++;
  });
  const hora = j => h.time[j].slice(11, 13) + ':00';
  const fin = j => String((parseInt(h.time[j].slice(11, 13), 10) + 1) % 24).padStart(2, '0') + ':00';
  return {
    dia,
    riesgo: peor ? peor.r : mrRiesgo(d.temperature_2m_max[i], d.relative_humidity_2m_min[i], d.wind_speed_10m_max[i]),
    horaCritica: peor ? hora(peor.j) : '',
    franja: franja.length ? hora(franja[0]) + ' a ' + fin(franja[franja.length - 1]) : '',
    puelche: pue > 0,
    tMax: d.temperature_2m_max[i], tMin: d.temperature_2m_min[i], humMin: d.relative_humidity_2m_min[i],

function dbAbrir() {

    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('cola', { keyPath: 'id', autoIncrement: true }); db.createObjectStore('cache'); };

  });

async function idb(store, modo, fn) {

    const req = fn(t.objectStore(store));
    t.oncomplete = () => { db.close(); ok(req ? req.result : undefined); };
    t.onerror = t.onabort = () => { db.close(); mal(t.error || new Error('Error de almacenamiento local')); };
  });
}

// Envía un avance nuevo (reg_id vacío) o una modificación (reg_id); lanza error si no se pudo
async function enviarAvance(p) {
  let ruta = null, nombre = null, tipo = null;
  if (p.archivo) {
    ruta = p.id_ppa + '/' + Date.now() + '-' + p.archivo.name.replace(/[^\w.\-]+/g, '_');
    const { error: eUp } = await sb.storage.from(EVID_BUCKET).upload(ruta, p.archivo, { contentType: p.archivo.type, upsert: false });
    if (eUp) throw new Error(esSinSenal(eUp) ? 'Failed to fetch' : 'No se pudo subir la evidencia: ' + eUp.message);
    nombre = p.archivoNombre; tipo = p.archivo.type;
  }
  const lat = p.geo ? p.geo.lat : null, lng = p.geo ? p.geo.lng : null;
  const r = p.reg_id
    ? await sb.rpc('ppa_editar_avance_pwa', { p_id: Number(p.reg_id), p_cantidad: p.cantidad, p_fecha: p.fecha, p_observacion: p.observacion || null,
        p_evidencia_ruta: ruta, p_evidencia_nombre: nombre, p_evidencia_tipo: tipo, p_lat: lat, p_lng: lng })
    : await sb.rpc('ppa_registrar_avance_pwa', { p_id_ppa: p.id_ppa, p_fecha: p.fecha, p_cantidad: p.cantidad, p_observacion: p.observacion || null,
        p_evidencia_ruta: ruta, p_evidencia_nombre: nombre, p_evidencia_tipo: tipo, p_lat: lat, p_lng: lng });
  if (r.error) throw r.error;
}
// Envía lo pendiente en orden; si vuelve a caer la señal, se detiene y queda para después
async function sincronizarPendientes() {
  if (S.sincronizando || !navigator.onLine) return;
  await refrescarPendientes();
  if (!S.pendientes.length) return;
  S.sincronizando = true; pintar();
  let enviados = 0;
  for (const it of S.pendientes) {
    try {
      await enviarAvance({ id_ppa: it.id_ppa, reg_id: it.reg_id, fecha: it.fecha, cantidad: it.cantidad, observacion: it.observacion, geo: it.geo, archivo: it.archivo, archivoNombre: it.archivoNombre });
      await colaQuitar(it.id); enviados++;
    } catch (e) {
      if (esSinSenal(e)) break;
      await colaActualizar(Object.assign({}, it, { intentos: (it.intentos || 0) + 1, error: e.message || String(e) }));
    }
  }
  S.sincronizando = false;
  await refrescarPendientes();
  if (enviados) { await cargarDatos(); toast('✅ ' + enviados + ' pendiente(s) enviado(s)'); }
  pintar();
}
async function guardarEdicion(a, reg, v) {
  const err = m => { $('av-err').textContent = m; $('av-err').style.display = ''; };
  const cant = v.cant(), fecha = v.fecha();
  if (!(cant > 0)) return err('La cantidad debe ser mayor que 0.');
  if (!fecha || fecha > hoyISO()) return err('Elige una fecha válida (no futura).');
  $('av-err').style.display = 'none';
  const btn = $('av-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  const arch = v.archivo();
  const p = { id_ppa: a.id_ppa, reg_id: reg.id, fecha, cantidad: cant, observacion: v.obs(), geo: v.geo(), archivo: null, archivoNombre: arch ? arch.name : null };
  try {
    if (arch) p.archivo = await reducirImagen(arch);
    if (!navigator.onLine) throw new Error('Failed to fetch');
    await enviarAvance(p);
    toast('✅ Registro modificado');
    await cargarDatos();
  } catch (e) {
    if (!esSinSenal(e)) { err(e.message || String(e)); btn.disabled = false; btn.textContent = '💾 Guardar cambios'; return; }
    await encolar('editar', p);
    toast('📵 Sin señal: modificación guardada en pendientes');
  }
  pintar();
  abrirRegistros(a.id_ppa);
}
function historialHtml(id) {
  const l = avancesDe(id);
  if (!l.length) return '<div class="muted">Esta acción aún no tiene avances registrados.</div>';
  return l.map(v => '<div class="hist"><b>' + fmtFecha(v.fecha) + '</b> · ' + num(v.cantidad) + ' · ' + esc(v.origen) + (v.observacion ? '<br>' + esc(v.observacion) : '') +
    (v.evidencia_ruta ? '<br><a href="#" data-evid="' + esc(v.evidencia_ruta) + '">📎 ' + esc(v.evidencia_nombre || 'evidencia') + '</a>' : '') + '</div>').join('');
}
async function reducirImagen(file) {
  if (!file.type.startsWith('image/')) return file;
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
  return new File([blob || file], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}
async function guardarAvance(a, v) {
  const err = m => { $('av-err').textContent = m; $('av-err').style.display = ''; };
  const cant = v.cant(), fecha = v.fecha();
  if (!(cant > 0)) return err('La cantidad debe ser mayor que 0.');
  if (!fecha || fecha > hoyISO()) return err('Elige una fecha válida (no futura).');
  $('av-err').style.display = 'none';
  const btn = $('av-guardar'); btn.disabled = true; btn.textContent = 'Guardando…';
  const arch = v.archivo();
  const p = { id_ppa: a.id_ppa, fecha, cantidad: cant, observacion: v.obs(), geo: v.geo(), archivo: null, archivoNombre: arch ? arch.name : null };
  try {
    if (arch) p.archivo = await reducirImagen(arch);
    if (!navigator.onLine) throw new Error('Failed to fetch');
    await enviarAvance(p);
    toast('✅ Avance registrado');
    await cargarDatos();
  } catch (e) {
    if (!esSinSenal(e)) { err(e.message || String(e)); btn.disabled = false; btn.textContent = '💾 Guardar avance'; return; }
    await encolar('registrar', p);
    toast('📵 Sin señal: avance guardado en pendientes');
  }
  cerrarAvance();
  pintar();
}
async function verEvidencia(ruta) {
  const { data, error } = await sb.storage.from(EVID_BUCKET).createSignedUrl(ruta, 300);
  if (error) return toast('No se pudo abrir la evidencia: ' + error.message);
  window.open(data.signedUrl, '_blank', 'noopener');
}

/* ───────── Eventos ───────── */
document.addEventListener('DOMContentLoaded', async () => {
  try { const m = localStorage.getItem('pta-correo'); if (m) { $('l-mail').value = m; $('l-clave').focus(); } } catch (e) { /* sin almacenamiento */ }
  $('l-entrar').onclick = entrar;
  $('l-clave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $('h-salir').onclick = salir;
  $('h-actualizar').onclick = actualizarDatos;
  document.querySelectorAll('#menu button').forEach(b => b.onclick = () => {
    S.sec = b.dataset.s;
    if (S.sec === 'meteo' && !S.meteo.datos && !S.meteo.cargando) return obtenerMeteo();
    pintar();
  });
  $('m-cuerpo').addEventListener('click', e => {
    const t = e.target.closest('[data-v]'); if (t) { S.vista = t.dataset.v; return pintarPpa(); }
    if (e.target.closest('[data-salir]')) return salir();
    if (e.target.closest('[data-meteo]')) return obtenerMeteo();
    if (e.target.closest('[data-sync]')) return sincronizarPendientes();
    const dsc = e.target.closest('[data-desc]');
    if (dsc) { if (window.confirm('¿Descartar este pendiente? No se enviará al servidor.')) colaQuitar(Number(dsc.dataset.desc)).then(refrescarPendientes).then(pintar); return; }
    if (e.target.closest('[data-actualizar]')) { actualizarDatos(); return; }
    if (e.target.closest('[data-fil]')) { S.filAbierto = !S.filAbierto; return pintarPpa(); }
    if (e.target.closest('[data-limpiar]')) { S.filtros = { subg: '', area: S.areaDefault, sector: '', grupo: '', q: S.filtros.q }; return pintarPpa(); }
    const r = e.target.closest('[data-reg]'); if (r) return abrirAvance(r.dataset.reg);
    const rs = e.target.closest('[data-regs]'); if (rs) return abrirRegistros(rs.dataset.regs);
    const c = e.target.closest('.acc[data-id]'); if (c) return abrirAvance(c.dataset.id);
    const gh = e.target.closest('[data-gid]'); if (gh) { S.grupoAbierto = S.grupoAbierto === gh.dataset.gid ? '' : gh.dataset.gid; return pintarPpa(); }
    const ir = e.target.closest('[data-ir]'); if (ir) { S.vista = 'registro'; S.grupoAbierto = ir.dataset.ir; return pintarPpa(); }
  });
  $('m-cuerpo').addEventListener('change', e => {
    const f = { 'f-subg': 'subg', 'f-area': 'area', 'f-sector': 'sector', 'f-grupo': 'grupo' }[e.target.id];
    if (!f) return;
    S.filtros[f] = e.target.value;
    if (f === 'area') S.filtros.sector = '';
    if (f === 'subg') { S.filtros.area = ''; S.filtros.sector = ''; }
    pintarPpa();
  });
  let esp = null;
  $('m-cuerpo').addEventListener('input', e => { if (e.target.id !== 'f-q') return; clearTimeout(esp); esp = setTimeout(() => { S.filtros.q = e.target.value; pintarPpa(); }, 250); });
  $('av-sheet').addEventListener('click', e => { const a = e.target.closest('[data-evid]'); if (a) { e.preventDefault(); verEvidencia(a.dataset.evid); } });
  $('ov-avance').addEventListener('click', e => { if (e.target.id === 'ov-avance') cerrarAvance(); });
  window.addEventListener('online', () => { toast('🟢 Conexión recuperada: enviando pendientes'); sincronizarPendientes(); });
  window.addEventListener('offline', () => { toast('🔴 Sin señal: los avances se guardarán en pendientes'); pintar(); });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-prevencion.js').catch(() => {});
  const { data } = await sb.auth.getSession();
  if (data && data.session) await mostrarApp(); else $('v-login').style.display = '';
});
