<style>
  :root { --azul:#1E3A8A; --azul2:#2563EB; --bg:#F1F5F9; --card:#FFFFFF; --txt:#0F172A; --sub:#64748B; --ok:#16A34A; --warn:#D97706; --err:#DC2626; --borde:#E2E8F0; }
  /* Tema SIEMPRE claro (10-11-2026): aunque el teléfono esté en modo oscuro, la app se ve igual que en el simulador. */
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--txt); }
  #v-app { height:100vh; height:100dvh; display:flex; flex-direction:column; }
  /* El encabezado deja libre la barra de estado del teléfono (hora, señal, batería) y la muesca / isla. */
  header { background: var(--azul); color:#fff; padding: calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left)); display:flex; align-items:center; gap:10px; flex:0 0 auto; position:relative; z-index:7; }
  header .btn-w { flex:0 0 auto; min-width:44px; min-height:40px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header small { opacity:.8; font-size:11px; display:block; font-weight:500; }
  main { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding: 12px 14px 18px; width:100%; max-width: 760px; margin: 0 auto; box-sizing:border-box; }
  .btn { border:0; border-radius:10px; padding:11px 14px; font:inherit; font-weight:700; cursor:pointer; background: var(--card); color: var(--txt); border:1px solid var(--borde); }
  .btn-p { background: var(--azul2); color:#fff; border-color: var(--azul2); }
  .btn-w { background: transparent; color:#fff; border-color: rgba(255,255,255,.4); padding:8px 10px; }
  /* v1.5.3: ícono de cerrar sesión dibujado (el símbolo ⏻ no existe en las fuentes de Android y salía un cuadro vacío) */
  .ico-salir { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2.4; stroke-linecap:round; vertical-align:middle; }
  .btn:disabled { opacity:.5; }
  .card { background: var(--card); border:1px solid var(--borde); border-radius:14px; padding:12px 14px; margin-bottom:10px; }
  .muted { color: var(--sub); font-size:12px; }
  input, select, textarea { width:100%; font:inherit; padding:10px 11px; border:1px solid var(--borde); border-radius:10px; background: var(--card); color: var(--txt); }
  label { display:block; font-size:12px; font-weight:700; color: var(--sub); margin: 10px 0 4px; }
  .fila { display:flex; gap:8px; }
  .fila > * { flex:1; min-width:0; }
  .kpis { display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; }
  .kpi { background: var(--card); border:1px solid var(--borde); border-radius:12px; padding:10px; }
  .kpi b { font-size:22px; display:block; }
  .kpi span { font-size:11px; color: var(--sub); font-weight:700; }
  .barra { height:8px; background: var(--borde); border-radius:6px; overflow:hidden; margin-top:6px; }
  .barra i { display:block; height:100%; background: var(--c, var(--azul2)); }
  .acc { border-left:5px solid var(--c, var(--azul2)); }
  .ind-fila { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
  .ind { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; white-space:nowrap; }
  .ind-venc { background:#FEE2E2; color:#991B1B; }
  .ind-mes { background:#DBEAFE; color:#1E40AF; }
  .ind-ok { background:#DCFCE7; color:#166534; }
  .ind-gris { background: var(--borde); color: var(--sub); }
  .kpi-btn { cursor:pointer; }
  .acc h3 { font-size:14px; margin:0 0 4px; }
  .chip { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
  nav.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:10px; }
  nav.tabs button { flex:0 0 auto; border:1px solid var(--borde); background: var(--card); color: var(--txt); border-radius:999px; padding:7px 12px; font:inherit; font-weight:700; font-size:13px; cursor:pointer; }
  nav.tabs button.on { background: var(--azul); color:#fff; border-color: var(--azul); }
  .menu { flex:0 0 auto; display:grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-top:1px solid var(--borde); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:6; }
  .menu button { border:0; background:none; color: var(--sub); font:inherit; font-size:11px; font-weight:700; padding:6px 2px; cursor:pointer; }
  .menu button.on { color: var(--azul2); }
  .menu .ico { font-size:20px; display:block; }
  /* v1.9.0 · 📡 Bitácora (reportabilidad) */
  .bt-rombo { width:12px; height:12px; background:#0F172A; border:2px solid #fff; transform:rotate(45deg); box-shadow:0 1px 4px rgba(0,0,0,.5); }
  .bt-vivo { position:relative; width:30px; height:30px; border-radius:50%; background:#F97316; border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .bt-vivo::after { content:''; position:absolute; inset:-7px; border-radius:50%; border:2px solid #F97316; animation: btOnda 2.2s ease-out infinite; }
  .bt-vivo.viejo { background:#94A3B8; } .bt-vivo.viejo::after { display:none; }
  @keyframes btOnda { 0% { transform:scale(.7); opacity:.8; } 100% { transform:scale(1.5); opacity:0; } }
  @media (max-width:380px) { .menu button { font-size:10px; } .menu .ico { font-size:18px; } }
  .overlay { position:fixed; inset:0; background: rgba(15,23,42,.6); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  .overlay.show { display:flex; }
  .sheet { background: var(--card); width:100%; max-width:760px; max-height:92vh; overflow:auto; border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:16px; margin:0 0 4px; }
  .aviso { background:#FEF3C7; color:#92400E; border-radius:10px; padding:9px 11px; font-size:12.5px; margin:8px 0; }
  .ok { background:#DCFCE7; color:#14532D; }
  .err { background:#FEE2E2; color:#7F1D1D; }
  .vacio { text-align:center; color: var(--sub); padding:30px 10px; }
  .login { position:fixed; inset:0; overflow:auto; display:flex; align-items:center; justify-content:center; padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 15% 10%, #2563EB 0%, transparent 50%), linear-gradient(160deg, #1E3A8A 0%, #0F766E 100%); z-index:20; }
  .lg-card { width:100%; max-width:380px; background: var(--card); border-radius:22px; padding:26px 22px 20px; box-shadow: 0 24px 60px rgba(2,6,23,.35); }
  .lg-logo { display:block; width:80px; height:80px; margin:0 auto 10px; border-radius:20px; box-shadow: 0 8px 20px rgba(2,6,23,.25); }
  .lg-titulo { text-align:center; font-size:21px; font-weight:800; color: var(--azul); margin:0; letter-spacing:.2px; }
  .lg-sub { text-align:center; font-size:13px; color: var(--sub); margin:6px 0 18px; }
  .lg-input { position:relative; }
  .lg-input input { padding-left:40px; height:46px; font-size:15px; }
  .lg-input .ic { position:absolute; left:13px; top:50%; transform:translateY(-50%); font-size:15px; opacity:.6; pointer-events:none; }
  .lg-check { display:flex; gap:10px; align-items:flex-start; font-size:13px; font-weight:600; color: var(--txt); margin:16px 0 2px; cursor:pointer; }
  .lg-check input { width:18px; height:18px; margin:1px 0 0; accent-color: var(--azul2); flex:0 0 auto; }
  .lg-nota { font-size:11.5px; color: var(--sub); margin:4px 0 0 28px; line-height:1.4; }
  .lg-btn { width:100%; height:48px; margin-top:16px; border:0; border-radius:12px; font-size:15px; letter-spacing:.2px; background: linear-gradient(90deg, #2563EB, #0F766E); color:#fff; box-shadow: 0 8px 18px rgba(37,99,235,.3); }
  .lg-btn:disabled { opacity:.6; }
  .lg-pie { text-align:center; font-size:11px; color: var(--sub); margin-top:16px; }
  .enDes { text-align:center; padding:40px 16px; }
  .enDes .ico { font-size:42px; }
  .hist { font-size:12px; border-top:1px solid var(--borde); padding:7px 0; }
  .card { transition: opacity .15s; }
  .dim { opacity:.38; }
  .btn-mini { padding:5px 9px; font-size:12px; border-radius:8px; line-height:1.2; white-space:nowrap; }
  .mr-hero { border-left:5px solid var(--rc, var(--azul2)); }
  .mr-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .mr-temp { font-size:40px; font-weight:800; line-height:1.1; }
  .mr-sub { font-size:11px; color: var(--sub); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:2px; }
  .mr-sem { display:inline-block; color:#fff; font-size:11px; font-weight:800; padding:3px 10px; border-radius:999px; white-space:nowrap; }
  .mr-h { font-size:14px; margin:14px 0 8px; }
  .mr-rec { font-size:13px; margin:4px 0; line-height:1.4; }
  .mr-dia { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; }
  .mr-dia-fecha { display:flex; flex-direction:column; min-width:0; font-size:12px; color: var(--sub); }
  .mr-dia-fecha b { font-size:13px; color: var(--txt); text-transform:capitalize; }
  .mr-dia-datos { display:flex; flex-direction:column; gap:2px; font-size:11.5px; color: var(--sub); text-align:right; flex:1; }
  .row-foot { display:flex; justify-content:center; margin-top:10px; }
  .pend-item { border-top:1px solid var(--borde); padding:9px 0; font-size:13px; }
  .pend-err { color: var(--err); font-size:12px; margin-top:3px; }
  .pend-acc { display:flex; justify-content:flex-end; margin-top:6px; }
  .rg-item { border-bottom:1px solid var(--borde); padding:10px 0; font-size:13px; }
  .rg-item:last-child { border-bottom:0; }
  .rg-top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:2px; }
  .rg-obs { margin:6px 0; padding:8px 10px; background: var(--bg); border-radius:10px; }
  .rg-acc { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .av-modo { font-size:12px; font-weight:700; color: var(--azul2); background: color-mix(in srgb, var(--azul2) 10%, transparent); padding:6px 10px; border-radius:10px; margin-top:8px; }
  /* Actualización de datos: contenido tenue hasta terminar, con aviso y el ícono girando */
  body.cargando #m-cuerpo { opacity:.4; pointer-events:none; transition: opacity .2s ease; }
  body.cargando #h-actualizar { animation: giro 1s linear infinite; }
  body.cargando::after { content:'⟳  Actualizando datos…'; position:fixed; top:68px; left:50%; transform:translateX(-50%); background:#0F172A; color:#fff; padding:9px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:25; box-shadow: 0 12px 28px rgba(2,6,23,.35); white-space:nowrap; }
  .franja-version { position:fixed; left:0; right:0; top:0; z-index:60; display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px calc(8px); padding-top:calc(8px + env(safe-area-inset-top)); background:#1E40AF; color:#fff; font-size:13px; font-weight:700; box-shadow:0 6px 18px rgba(2,6,23,.3); }
  .franja-version button { background:#fff; color:#1E40AF; border:0; border-radius:999px; padding:5px 12px; font-weight:800; font-size:12.5px; }
  .toast-msg { position:fixed; left:50%; bottom:96px; transform:translateX(-50%); max-width:calc(100% - 32px); background:#0F172A; color:#fff; padding:11px 18px; border-radius:14px; font-size:14px; font-weight:700; text-align:center; box-shadow: 0 12px 28px rgba(2,6,23,.35); z-index:30; animation: toastIn .25s ease; }
  @keyframes toastIn { from { opacity:0; transform: translate(-50%, 12px); } to { opacity:1; transform: translate(-50%, 0); } }
  @keyframes giro { to { transform: rotate(360deg); } }
  /* Formulario Registrar avance: encabezado y pie fijos, solo el cuerpo se desplaza */
  #av-sheet.sheet { padding:0; display:flex; flex-direction:column; max-height:86vh; overflow:hidden; border-radius:20px; width:calc(100% - 24px); margin:0 12px 12px; box-sizing:border-box; }
  .av-top { display:flex; gap:10px; align-items:flex-start; padding:14px 16px 12px; border-bottom:1px solid var(--borde); flex:0 0 auto; }
  .av-grupo { display:inline-block; font-size:11px; font-weight:700; color: var(--azul2); background: color-mix(in srgb, var(--azul2) 12%, transparent); padding:2px 9px; border-radius:999px; margin-bottom:5px; }
  .av-accion { font-size:15px; font-weight:700; margin:0; line-height:1.3; }
  .av-meta { font-size:11.5px; color: var(--sub); margin-top:3px; }
  .av-x { border:0; background: var(--bg); color: var(--sub); width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer; flex:0 0 auto; }
  .av-body { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:12px 16px; }
  .av-avance { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:13px; }
  .av-fila2 { display:grid; grid-template-columns: 1fr 1.5fr; gap:10px; }
  .av-fila2 input { height:40px; padding:8px 10px; }
  .av-body label { margin-top:10px; }
  .av-nuevo { font-size:11.5px; margin-top:4px; }
  .av-adj { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .av-btn { border:1px solid var(--borde); background: var(--card); color: var(--txt); border-radius:10px; padding:9px 8px; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
  .av-btn:active { background: var(--bg); }
  .av-btn-del { color:#B91C1C; border-color:#FCA5A5; }
  .av-arch { font-size:12px; margin-top:6px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .av-quitar { border:0; background:transparent; color: var(--err); font-weight:800; cursor:pointer; padding:0 4px; }
  .av-mapa { position:relative; height:160px; border-radius:12px; overflow:hidden; border:1px solid var(--borde); background: var(--bg); display:flex; align-items:center; justify-content:center; }
  .av-leaf { position:absolute; inset:0; background:#DDE3EA; }
  .av-relieve-capa { mix-blend-mode:multiply; opacity:.45; }
  .av-capas { position:absolute; top:8px; left:8px; display:flex; background: rgba(255,255,255,.94); border-radius:999px; padding:3px; box-shadow: 0 2px 8px rgba(2,6,23,.3); z-index:1000; }
  .av-capas button { border:0; background:none; color:#0F172A; font:inherit; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; cursor:pointer; min-height:32px; }
  .av-capas button.on { background: var(--azul2); color:#fff; }
  .av-grande { position:absolute; top:8px; right:8px; z-index:1000; width:40px; height:40px; border:0; border-radius:10px; background: rgba(255,255,255,.94); color:#0F172A; font-size:20px; font-weight:800; cursor:pointer; box-shadow: 0 2px 8px rgba(2,6,23,.3); }
  .av-pin-ico { background:none; border:0; filter: drop-shadow(0 3px 4px rgba(0,0,0,.45)); }
  .av-cap { position:absolute; left:8px; bottom:8px; z-index:1000; max-width:calc(100% - 70px); background: rgba(15,23,42,.78); color:#fff; font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; pointer-events:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .av-ayuda { position:absolute; left:50%; top:52px; transform:translateX(-50%); z-index:1000; background: rgba(15,23,42,.72); color:#fff; font-size:11px; padding:3px 10px; border-radius:999px; pointer-events:none; white-space:nowrap; display:none; }
  .av-mapa.grande .av-ayuda { display:block; }
  /* ⛶ Mapa agrandado: ocupa toda la pantalla, respetando la barra de estado y la zona inferior del teléfono */
  .av-mapa.grande { position:fixed; inset:0; height:auto !important; z-index:60; border-radius:0; border:0; margin:0; }
  .av-listo { display:none; position:absolute; left:50%; transform:translateX(-50%); bottom:calc(52px + env(safe-area-inset-bottom)); z-index:1000; border:0; border-radius:999px; padding:12px 22px; font:inherit; font-size:15px; font-weight:800; color:#fff; background: linear-gradient(90deg, #2563EB, #0F766E); box-shadow: 0 8px 20px rgba(2,6,23,.4); cursor:pointer; white-space:nowrap; }
  .av-mapa.grande .av-listo { display:block; }

  .av-mapa.grande .av-grande { top:calc(10px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); }
  /* v1.7.0: capas de contexto (sectores / fundos) del mapa de actividades */
  .av-ctx-btn { position:absolute; top:56px; right:8px; z-index:1000; width:40px; height:40px; border:0; border-radius:10px; background: rgba(255,255,255,.94); font-size:19px; cursor:pointer; box-shadow: 0 2px 8px rgba(2,6,23,.3); }
  .av-ctx-panel { position:absolute; top:56px; right:54px; z-index:1001; background:#fff; color:#0F172A; border-radius:12px; padding:10px 12px; box-shadow: 0 4px 16px rgba(2,6,23,.35); font-size:13px; display:flex; flex-direction:column; gap:7px; max-width:calc(100% - 70px); }

  .av-ctx-panel small { color:#64748B; font-weight:400; }
  .av-mapa.grande .av-ctx-btn { top:calc(58px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); }

  .ayuda-ubic li { margin:6px 0; line-height:1.4; }
  .av-etq { background:none; border:0; }

  .av-etq-fundo span { color:#064E3B; background: rgba(236,253,245,.85); border:1px solid rgba(5,150,105,.5); }
  .av-etq-sector span { color:#fff; background: rgba(15,23,42,.6); font-size:11.5px; }

async function leerTodo(tabla, select, filtro) {
  const out = [];
  for (let d = 0; ; d += 1000) {
    let q = sb.from(tabla).select(select).range(d, d + 999);
    if (filtro) q = filtro(q);
    const { data, error } = await q;
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < 1000) break;

  return out;
}

 * sin frecuencia → Q1/Q2 si las tiene, si no la mensual en la Q2.
 * % de cumplimiento = avance cargado ÷ meta acumulada hasta el mes vigente (incluido).

async function alcanceDesdeCache() {

  S.esAdmin = !!c.esAdmin; S.misAreasPpa = c.esAdmin ? null : (c.ids || []); S.misAreasClaves = c.claves || [];
  S.puedeElegirArea = S.esAdmin || (c.ids || []).length > 1;

/* v1.5.1: Jefe de Área / Gestor / Subgerente / GRD ven el PPA SOLO de las áreas de su perfil (perfil_areas), además del RLS del servidor.
 * El Administrador ve todas. Se aplica a las acciones, sus avances y sus metas (también con los datos guardados sin señal). */
function claveArea(s) { return String(s || '').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Z0-9]/g, ''); }
function aplicarAreasPerfil() {
  if (S.esAdmin || !Array.isArray(S.misAreasPpa)) return;
  const ids = new Set(S.misAreasPpa), claves = new Set(S.misAreasClaves || []);
  S.ppa = S.ppa.filter(a => ids.has(String(a.id_area)) || (claves.size && claves.has(claveArea(a.area_nombre || a.area))));
  const v = new Set(S.ppa.map(a => a.id_ppa));
  S.avances = (S.avances || []).filter(x => v.has(x.id_ppa));
  S.metas = (S.metas || []).filter(m => v.has(m.id_ppa));
}
function avancesDe(id) { return S.avances.filter(a => a.id_ppa === id).sort((x, y) => String(y.fecha).localeCompare(String(x.fecha))); }
function avanceTotal(id) { return avancesDe(id).reduce((s, a) => s + (Number(a.cantidad) || 0), 0); }
function valoresUnicos(k, n) { const m = new Map(); S.ppa.forEach(a => { if (a[k] != null && a[k] !== '') m.set(String(a[k]), a[n] || a[k]); }); return [...m.entries()].sort((x, y) => String(x[1]).localeCompare(String(y[1]), 'es')); }
function filtradas() {
  const f = S.filtros, q = (f.q || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return S.ppa.filter(a =>
    (!f.subg || String(a.id_subg) === f.subg) && (!f.area || String(a.id_area) === f.area) &&
    (!f.sector || (a.sector || 'Toda el área') === f.sector) && (!f.grupo || a.id_grupo === f.grupo) &&
    (!S.solo || !!a.activo) &&
    (!S.indic || (S.indic === 'vencidas' ? indicadores(a).vencida : indicadores(a).delMes)) &&
    (!q || norm([a.id_ppa, a.accion, a.area_nombre, a.sector, a.grupo, a.causa].join(' ')).includes(q)));
}

// Agrupa las acciones filtradas por Grupo Plan, con el cumplimiento al mes vigente, las medidas vencidas y las del mes (v1.4.0)
// (el avance de cada medida cuenta hasta su meta al mes: lo adelantado en una medida no tapa lo atrasado de otra)
function resumenDe(acciones) {
  const r = { metaAl: 0, av: 0, metaTot: 0, avTot: 0, vencidas: 0, faltaVencida: 0, delMes: 0, mesListas: 0, metaMes: 0, avMes: 0, sinMetaAun: 0 };
  acciones.forEach(a => {
    const k = indicadores(a);
    r.metaAl += k.metaAlMes; r.av += Math.min(k.av, k.metaAlMes);
    r.metaTot += k.metaTotal; r.avTot += Math.min(k.av, k.metaTotal);
    if (k.vencida) { r.vencidas++; r.faltaVencida += k.falta; }
    if (k.delMes) { r.delMes++; r.metaMes += k.metaMes; r.avMes += Math.min(k.avMes, k.metaMes); if (k.mesListo) r.mesListas++; }
    if (!k.metaAlMes) r.sinMetaAun++;
  });
  r.p = pct(r.av, r.metaAl); r.pGen = pct(r.avTot, r.metaTot);
  return r;
}
function gruposDe(lista) {
  const m = new Map();
  lista.forEach(a => {
    const k = a.id_grupo || 'SIN';
    if (!m.has(k)) m.set(k, { id: k, nombre: a.grupo || 'Sin grupo', acciones: [] });
    m.get(k).acciones.push(a);
  });
  return [...m.values()].map(g => Object.assign(g, resumenDe(g.acciones))).sort((x, y) => String(x.id).localeCompare(String(y.id), 'es'));
}

/* ───────── Meteorología: tablero del pronóstico en la ubicación GPS del teléfono ───────── */
// Misma lógica que el módulo meteorológico del sistema (riesgo de incendio por temperatura, humedad y viento; puelche; Open-Meteo)
const MR_COLOR = { bajo: '#16A34A', moderado: '#F59E0B', alto: '#EA580C', extremo: '#DC2626' };
const MR_ETIQ = { bajo: 'BAJO', moderado: 'MODERADO', alto: 'ALTO', extremo: 'EXTREMO' };
const MR_ORDEN = { bajo: 0, moderado: 1, alto: 2, extremo: 3 };
function mrRiesgo(temp, hum, viento) {
  temp = temp || 0; hum = hum == null ? 50 : hum; viento = viento || 0;
  let s = 0;
  if (temp >= 30) s += 3; else if (temp >= 25) s += 2; else if (temp >= 20) s += 1;
  if (hum <= 20) s += 3; else if (hum <= 30) s += 2; else if (hum <= 40) s += 1;
  if (viento >= 40) s += 3; else if (viento >= 25) s += 2; else if (viento >= 15) s += 1;
  const nivel = s >= 7 ? 'extremo' : s >= 5 ? 'alto' : s >= 3 ? 'moderado' : 'bajo';
  return { nivel, etiqueta: MR_ETIQ[nivel], color: MR_COLOR[nivel] };
}
function mrCielo(wc) {
  if (wc == null) return ['🌤️', 'Variable'];
  if (wc >= 95) return ['⛈️', 'Tormentas'];
  if (wc >= 85 || (wc >= 71 && wc <= 77)) return ['🌨️', 'Nieve'];
  if (wc >= 80) return ['🌦️', 'Chubascos'];
  if (wc >= 61) return ['🌧️', 'Lluvia'];
  if (wc >= 51) return ['🌦️', 'Llovizna'];
  if (wc >= 45) return ['🌫️', 'Niebla'];
  if (wc === 3) return ['🌥️', 'Nublado'];
  if (wc >= 1) return ['🌤️', 'Parcial'];
  return ['☀️', 'Despejado'];
}
function mrDir(deg) { return deg == null ? '—' : ['N', 'NNE', 'NE', 'ENE', 'E', 'ESE', 'SE', 'SSE', 'S', 'SSO', 'SO', 'OSO', 'O', 'ONO', 'NO', 'NNO'][Math.round(deg / 22.5) % 16]; }
const mrDiaCorto = iso => new Date(iso + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'short', day: '2-digit', month: '2-digit' });
// Análisis de un día: riesgo de la hora más crítica, franja de riesgo alto, puelche y datos diarios
function mrDia(m, i) {
  const h = m.hourly, d = m.daily, dia = d.time[i], horas = [];
  h.time.forEach((t, j) => { if (t.slice(0, 10) === dia) horas.push(j); });
  let peor = null, kMax = -1e9, franja = [], pue = 0;
  horas.forEach(j => {
    const r = mrRiesgo(h.temperature_2m[j], h.relative_humidity_2m[j], h.wind_speed_10m[j]);
    const k = MR_ORDEN[r.nivel] * 100 + (h.temperature_2m[j] || 0) + (h.wind_speed_10m[j] || 0) - (h.relative_humidity_2m[j] || 0) / 2;
    if (k > kMax) { kMax = k; peor = { j, r }; }
    if (r.nivel === 'alto' || r.nivel === 'extremo') franja.push(j);
    const dd = h.wind_direction_10m[j], vv = h.wind_speed_10m[j] || 0, hh = h.relative_humidity_2m[j];
    if (dd != null && dd >= 45 && dd <= 135 && vv >= 12 && hh != null && hh <= 45) pue++;
  });
  const hora = j => h.time[j].slice(11, 13) + ':00';
  const fin = j => String((parseInt(h.time[j].slice(11, 13), 10) + 1) % 24).padStart(2, '0') + ':00';
  return {
    dia,
    riesgo: peor ? peor.r : mrRiesgo(d.temperature_2m_max[i], d.relative_humidity_2m_min[i], d.wind_speed_10m_max[i]),
    horaCritica: peor ? hora(peor.j) : '',
    franja: franja.length ? hora(franja[0]) + ' a ' + fin(franja[franja.length - 1]) : '',
    puelche: pue > 0,
    tMax: d.temperature_2m_max[i], tMin: d.temperature_2m_min[i], humMin: d.relative_humidity_2m_min[i],
    vMax: d.wind_speed_10m_max[i], gMax: d.wind_gusts_10m_max[i], dir: mrDir(d.wind_direction_10m_dominant[i]),
    lluvia: d.precipitation_sum[i] || 0,
    cielo: mrCielo(d.weather_code ? d.weather_code[i] : null)
  };
}
async function mrConsultar(lat, lng) {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng +
    '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m,weather_code' +
    '&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_gusts_10m,wind_direction_10m' +
    '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,wind_gusts_10m_max,relative_humidity_2m_min,wind_direction_10m_dominant,weather_code' +
    '&timezone=America%2FSantiago&forecast_days=7';
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
// v1.7.1: una página web NO puede activar sola un permiso que el usuario (o el teléfono) negó: el navegador no vuelve a preguntar.
// Por eso: 1) si el GPS de alta precisión falla, se reintenta con precisión normal; 2) sin permiso, el pronóstico usa la ÚLTIMA ubicación
// conocida o un LUGAR ELEGIDO EN EL MAPA (se recuerda en el equipo: localStorage 'prev_meteo_lugar'); 3) se muestran los pasos exactos
// para activarlo en Android (Chrome o app instalada).
function posicionGps(alta, espera) {
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal({ code: 'NOGEO' });
    navigator.geolocation.getCurrentPosition(
      p => ok({ lat: p.coords.latitude, lng: p.coords.longitude, precision: p.coords.accuracy }),
      mal, { enableHighAccuracy: alta, timeout: espera, maximumAge: 120000 });
  });
}
async function obtenerPosicion() {
  try { return await posicionGps(true, 15000); }
  catch (e) { if (e && (e.code === 2 || e.code === 3)) return posicionGps(false, 20000); throw e; }
}

function guardarLugar(l) { try { localStorage.setItem('prev_meteo_lugar', JSON.stringify(l)); } catch (e) {} }

async function obtenerMeteo() {
  S.meteo = Object.assign({}, S.meteo, { cargando: true, error: '' });
  pintar();
  let pos = null, codigo = null, msg = '';
  try {
    pos = await obtenerPosicion();
    pos.fuente = 'gps';
    guardarLugar({ lat: pos.lat, lng: pos.lng, fuente: 'gps', fecha: new Date().toISOString() });
  } catch (e) {
    codigo = e && e.code;
    if (codigo === 1) msg = 'El permiso de ubicación está desactivado para esta app.';
    else if (codigo === 2) msg = 'El teléfono no logra ubicarte: activa la Ubicación (GPS) del teléfono.';
    else if (codigo === 3) msg = 'No se obtuvo la ubicación a tiempo: verifica que el GPS esté activo.';
    else if (codigo === 'NOGEO') msg = 'Este equipo no entrega ubicación.';
    else msg = 'No se pudo obtener la ubicación.';
    const l = lugarGuardado();   // respaldo: lugar elegido en el mapa o última ubicación GPS
    if (l && isFinite(l.lat) && isFinite(l.lng)) pos = { lat: l.lat, lng: l.lng, precision: null, fuente: l.fuente === 'gps' ? 'ultima' : 'manual', fecha: l.fecha };
  }
  if (!pos) { S.meteo = { cargando: false, error: msg, codigo, pos: null, datos: null, hora: null }; pintar(); return; }
  try {
    const datos = await mrConsultar(pos.lat.toFixed(4), pos.lng.toFixed(4));
    S.meteo = { cargando: false, error: '', aviso: pos.fuente === 'gps' ? '' : msg, codigo, pos, datos, hora: new Date() };
  } catch (e) {
    S.meteo = { cargando: false, error: 'No se pudo consultar el pronóstico. Revisa la conexión a internet y vuelve a intentar.', codigo, pos: null, datos: null, hora: null };
  }

}

/* ───────── Modo sin señal: cola de pendientes y caché de datos (IndexedDB) ───────── */
function dbAbrir() {
  return new Promise((ok, mal) => {
    const r = indexedDB.open('prevencion-pwa', 1);
    r.onupgradeneeded = () => { const db = r.result; db.createObjectStore('cola', { keyPath: 'id', autoIncrement: true }); db.createObjectStore('cache'); };
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
}
async function idb(store, modo, fn) {
  const db = await dbAbrir();
  return new Promise((ok, mal) => {
    const t = db.transaction(store, modo);
    const req = fn(t.objectStore(store));
    t.oncomplete = () => { db.close(); ok(req ? req.result : undefined); };
    t.onerror = t.onabort = () => { db.close(); mal(t.error || new Error('Error de almacenamiento local')); };
  });
}
const colaListar = () => idb('cola', 'readonly', s => s.getAll()).then(l => (l || []).sort((x, y) => x.id - y.id));
const colaAgregar = it => idb('cola', 'readwrite', s => s.add(it));
const colaActualizar = it => idb('cola', 'readwrite', s => s.put(it));
const colaQuitar = id => idb('cola', 'readwrite', s => s.delete(id));

const cacheGet = k => idb('cache', 'readonly', s => s.get(k)).catch(() => null);

async function enviarAvance(p) {

    if (eUp) throw new Error(esSinSenal(eUp) ? 'Failed to fetch' : 'No se pudo subir la evidencia: ' + eUp.message);
    nombre = p.archivoNombre; tipo = p.archivo.type;

  const r = p.reg_id
    ? await sb.rpc('ppa_editar_avance_pwa', { p_id: Number(p.reg_id), p_cantidad: p.cantidad, p_fecha: p.fecha, p_observacion: p.observacion || null,

    : await sb.rpc('ppa_registrar_avance_pwa', { p_id_ppa: p.id_ppa, p_fecha: p.fecha, p_cantidad: p.cantidad, p_observacion: p.observacion || null,

// Envía lo pendiente en orden; si vuelve a caer la señal, se detiene y queda para después
async function sincronizarPendientes() {
  if (S.sincronizando || !navigator.onLine) return;
  await refrescarPendientes();
  if (!S.pendientes.length) return;
  S.sincronizando = true; pintar();
  let enviados = 0;
  for (const it of S.pendientes) {
    try {
      await enviarAvance({ id_ppa: it.id_ppa, reg_id: it.reg_id, fecha: it.fecha, cantidad: it.cantidad, observacion: it.observacion, geo: it.geo, archivo: it.archivo, archivoNombre: it.archivoNombre });
      await colaQuitar(it.id); enviados++;
    } catch (e) {
      if (esSinSenal(e)) break;
      await colaActualizar(Object.assign({}, it, { intentos: (it.intentos || 0) + 1, error: e.message || String(e) }));
    }
  }
  S.sincronizando = false;

  if (enviados) { await cargarDatos(); toast('✅ ' + enviados + ' pendiente(s) enviado(s)'); }

async function reducirImagen(file) {
  if (!file.type.startsWith('image/')) return file;
  const img = await new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = URL.createObjectURL(file); });
  const k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.8));
  return new File([blob || file], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}

    if (Object.keys(ic.porTipo).length || Object.keys(ic.emoji).length) cacheSet('rc_iconos', ic);

function rcEmojiPalabras(tipo) {
  const t = String(tipo || '').toLowerCase();

  if (t.includes('montad') || t.includes('caballo')) return '🐴';
  if (t.includes('motoriz') || t.includes('moto')) return '🏍️';
  if (t.includes('dron')) return '🛸';
  if (t.includes('camión') || t.includes('camion')) return '🚛';

function rcIcono(r) {

  if (RC_ICONOS_SISTEMA[k]) return { url: RC_ICONOS_SISTEMA[k] };

async function rcCargarCopamiento() {
  const a = await rcAlcance();
  const com = await rcComunas();
  try {
    const [ac, res] = await Promise.all([
      sb.from('v_area_comunas_admin').select('area, area_norm, id_comuna'),
      sb.rpc('resumen_comunas_prevencion'),
    ]);
    if (ac.error) throw ac.error;
    if (res.error) throw res.error;
    const porIdC = new Map(com.map(c => [String(c.id_comuna), c]));
    const resumen = {}; (res.data || []).forEach(x => { resumen[String(x.id_comuna)] = x; });
    // Áreas visibles: Admin todas; Jefe/Subgerente/GRT las suyas; GRD sus comunas (grupo «Mis comunas»)
    const areas = new Map();
    (ac.data || []).forEach(r => {
      const k = rcClave(r.area);
      if (!a.admin && !a.areaClaves.includes(k)) return;
      if (!areas.has(k)) areas.set(k, { clave: k, nombre: r.area, comunas: new Set() });
      areas.get(k).comunas.add(String(r.id_comuna));
    });
    if (!a.admin && !areas.size && a.comunas.length) {
      const ids = com.filter(c => a.comunas.includes(String(c.id))).map(c => String(c.id_comuna));
      areas.set('MIS', { clave: 'MIS', nombre: 'Mis comunas', comunas: new Set(ids) });
    }
    const lista = [...areas.values()].map(ar => ({ clave: ar.clave, nombre: ar.nombre,
      comunas: [...ar.comunas].map(id => { const c = porIdC.get(id) || {}; return { id_comuna: id, slug: c.id ? String(c.id) : '', nombre: c.comuna || ('Comuna ' + id), r: resumen[id] || null }; })
        .sort((x, y) => x.nombre.localeCompare(y.nombre, 'es')) }))
      .sort((x, y) => x.nombre.localeCompare(y.nombre, 'es'));
    RC.cop = { areas: lista, fecha: new Date().toISOString() };
    cacheSet('rc_copamiento', RC.cop);
  } catch (e) {
    const c = await cacheGet('rc_copamiento');
    RC.cop = c || { areas: [], error: e.message || String(e) };
    if (c) toast('📵 Sin señal: copamiento guardado del ' + fmtFecha(c.fecha));
  }
}

/* ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════
 * v1.9.0 · 📡 BITÁCORA (REPORTABILIDAD) — para el Área de Relacionamiento y los gestores (Administrador y perfil Jefe de Área:
 * Jefes, Subgerentes y GRT). Controla los recursos de la App Bitácora de SUS áreas (lo decide el RLS: bit_puede_ver_recurso_ /
 * bit_ve_companero_, SQL 183 / 195):
 *   📋 Aperturas ... del día elegido: abiertas, cerradas, ⚠️ faltan (de turno según el calendario y sin apertura), libres / otro estado
 *                    y sin turno; dotación, jefe, actividades y % del turno registrado (bit_mis_recursos + v_bit_jornadas).
 *   🗺️ Mapa ....... actividades con su ubicación del día y de los días anteriores (1 / 3 / 7 días; v_bit_actividades) y el punto de
 *                    cada apertura; hoy, además, la ubicación en vivo y el recorrido (bit_mapa_jornada).
 *   📡 En vivo .... última ubicación de cada recurso con la jornada abierta (cada 60 s), ordenada por la más reciente.
 * Todo queda en el teléfono (cache) para verlo sin señal.
 * ════════════════════════════════════════════════════════════════════════════════════════════════════════════════════ */
const BT = { vista: 'aperturas', fecha: '', area: '', tipo: '', filtro: '', dias: 1, recursos: null, estados: null, dia: {}, acts: {}, vivo: {}, mapa: null, timer: null };
const BT_EMOJI = { BMP: '🚒', BD: '🚓', VC: '🛻', VM: '🏍️', VI: '🚶', VMON: '🐎' };
const BT_ST = {
  falta:   { t: '⚠️ Falta apertura', c: '#DC2626', o: 0 },
  abierta: { t: '🟢 Abierta', c: '#16A34A', o: 1 },
  cerrada: { t: '✅ Cerrada', c: '#2563EB', o: 2 },
  libre:   { t: '🏠 Libre / otro', c: '#7C3AED', o: 3 },
  sin:     { t: '· Sin turno', c: '#94A3B8', o: 4 },
};
function btPuede() { const a = RC.alcance || {}; return !!a.admin || /jefe de [aá]rea/i.test(a.perfil || ''); }
function btSumarDias(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const btHm = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
function btHace(ts) { const m = Math.round((Date.now() - new Date(ts).getTime()) / 60000); return m < 1 ? 'recién' : m < 60 ? 'hace ' + m + ' min' : m < 1440 ? 'hace ' + Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : 'hace ' + Math.floor(m / 1440) + ' día(s)'; }
function btTel(t) { const d = String(t || '').replace(/\D/g, ''); if (d.length < 8) return esc(t || ''); const w = d.length === 9 ? '56' + d : d; return esc(t) + ' <a href="tel:+' + w + '">📞</a> <a href="https://wa.me/' + w + '" target="_blank" rel="noopener">💬</a>'; }
function btQuitarMapa() { if (BT.mapa) { try { BT.mapa.remove(); } catch (e) {} BT.mapa = null; } }
function btParar() { if (BT.timer) { clearTimeout(BT.timer); BT.timer = null; } }

// ── Datos
async function btCargarBase() {
  if (BT.recursos && BT.estados) return;
  try {
    const [r, e] = await Promise.all([sb.rpc('bit_mis_recursos'), sb.from('bit_estado_dia').select('codigo, nombre, emoji, en_servicio')]);
    if (r.error) throw r.error;
    BT.recursos = r.data || []; BT.estados = e.error ? [] : (e.data || []);
    cacheSet('bt_base', { recursos: BT.recursos, estados: BT.estados, fecha: new Date().toISOString() });
  } catch (er) {
    const c = await cacheGet('bt_base');
    if (c) { BT.recursos = c.recursos || []; BT.estados = c.estados || []; toast('📵 Sin señal: recursos guardados del ' + fmtFecha(c.fecha)); }
    else { BT.recursos = []; BT.estados = []; BT.error = /bit_mis_recursos|schema cache|does not exist/i.test(er.message || '') ? 'La base aún no tiene la Bitácora.' : (er.message || String(er)); }
  }
}
async function btCargarDia(f, forzar) {
  if (BT.dia[f] && !forzar) return BT.dia[f];
  try {
    const l = await leerTodo('v_bit_jornadas', '*', q => q.eq('fecha_operativa', f));
    BT.dia[f] = { lista: l, fecha: new Date().toISOString() }; cacheSet('bt_dia_' + f, BT.dia[f]);
  } catch (e) { BT.dia[f] = (await cacheGet('bt_dia_' + f)) || { lista: [], error: e.message || String(e) }; }
  return BT.dia[f];
}
async function btCargarActs(desde, hasta, forzar) {
  const k = desde + '|' + hasta;
  if (BT.acts[k] && !forzar) return BT.acts[k];
  try {
    const l = await leerTodo('v_bit_actividades', 'id, recurso_id, jornada_id, fecha_operativa, actividad, grupo, grupo_emoji, clasificacion, clasificacion_emoji, clasificacion_color, inicio, fin, cantidad, lat, lng, fundo_nombre, observacion',
      q => q.gte('fecha_operativa', desde).lte('fecha_operativa', hasta).order('inicio'));
    BT.acts[k] = l; cacheSet('bt_acts_' + k, l);
  } catch (e) { BT.acts[k] = (await cacheGet('bt_acts_' + k)) || []; }
  return BT.acts[k];
}
async function btCargarVivo(f, forzar) {
  if (BT.vivo[f] && !forzar && Date.now() - BT.vivo[f].en < 50000) return BT.vivo[f];
  try {
    const { data, error } = await sb.rpc('bit_mapa_jornada', { p_fecha: f });
    if (error) throw error;
    BT.vivo[f] = { recursos: data.recursos || [], en: Date.now() }; cacheSet('bt_vivo_' + f, BT.vivo[f]);
  } catch (e) { BT.vivo[f] = (await cacheGet('bt_vivo_' + f)) || { recursos: [], en: 0, sin: true }; }
  return BT.vivo[f];
}
// Estado de cada recurso en la fecha (mismas reglas que la App Bitácora)
function btEstado(r, j, f) {
  const plan = j && j.plan_de_turno != null ? !!j.plan_de_turno : (r.dias_de_turno || []).some(d => String(d).slice(0, 10) === f);
  if (!j) return plan ? 'falta' : 'sin';
  if (!j.en_servicio) return 'libre';
  return (j.cierre_en || (j.cierre_programado && Date.now() > new Date(j.cierre_programado).getTime())) ? 'cerrada' : 'abierta';
}
function btRecursosFiltrados() {
  return (BT.recursos || []).filter(r => (!BT.area || String(r.id_area) === BT.area) && (!BT.tipo || r.tipo_codigo === BT.tipo));
}

// ── Pintado general
async function pintarBitacora() {
  btQuitarMapa(); btParar();
  if (!BT.fecha) BT.fecha = hoyISO();

  if (!BT.recursos) { $('m-cuerpo').innerHTML = '<div class="vacio">Cargando los recursos de la Bitácora…</div>'; await btCargarBase(); if (S.sec !== 'bitacora') return; }
  const f = BT.fecha, hoy = hoyISO();

  if (BT.area && !areas.some(([id]) => id === BT.area)) BT.area = '';

  const tabs = '<nav class="tabs">' + [['aperturas', '📋 Aperturas'], ['mapa', '🗺️ Mapa'], ['vivo', '📡 En vivo']]
    .map(([k, t]) => '<button data-btv="' + k + '" class="' + (BT.vista === k ? 'on' : '') + '">' + t + '</button>').join('') + '</nav>';
  const nav = BT.vista === 'vivo' ? '' : '<div class="fila" style="align-items:center;margin-bottom:8px;"><button class="btn" data-bt-dia="-1" style="flex:0 0 auto;">◀</button>' +
    '<div style="text-align:center;font-weight:800;">' + esc(new Date(f + 'T12:00:00').toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' })) +

// ── 📋 Aperturas del día
async function btPintarAperturas() {

    kp('falta', 'Faltan (de turno)', n('falta'), BT_ST.falta.c) + kp('libre', 'Libres / otro', n('libre'), BT_ST.libre.c) + kp('sin', 'Sin turno', n('sin'), BT_ST.sin.c) + '</div>';

  html += vis.map(({ r, j, k, pos }) => {

      ' · 🧩 ' + (j.actividades_n || 0) + ' act. · ' + (j.avance_pct != null ? j.avance_pct + ' % del turno' : '—') + (j.fundo_nombre ? '<br>🌲 ' + esc(j.fundo_nombre) : '');
    else if (j && j.observacion) det = esc(j.observacion);

    dato('Dotación', (j.dotacion_n || 0) + ' persona(s)') + dato('Móvil', esc(j.patente || '')) + dato('Fundo', esc(j.fundo_nombre || '')) +
    dato('Apertura', esc(j.creado_dispositivo_en || j.creado_en ? btHm(j.creado_dispositivo_en || j.creado_en) : '')) +
    dato('Cierre', j.cierre_en ? '🔒 ' + esc(btHm(j.cierre_en)) : j.cierre_programado ? 'Se cierra ' + esc(btHm(j.cierre_programado)) : '');
  if (v && v.ultima) html += dato('📡 Última ubicación', esc(btHace(v.ultima.fecha)) + ' (' + esc(btHm(v.ultima.fecha)) + ')');
  html += '<div class="av-mapa" id="bt-ficha-mapa" style="height:220px;margin:10px 0;"></div>';
  html += '<b style="font-size:13px;">🧩 Actividades (' + acts.length + ')</b>' + (acts.map(a => '<div class="hist"><b>' + esc(btHm(a.inicio)) + '–' + esc(btHm(a.fin)) + '</b> · ' + esc((a.clasificacion_emoji || a.grupo_emoji || '') + ' ' + (a.actividad || '')) +
    (a.cantidad > 1 ? ' ×' + a.cantidad : '') + (a.fundo_nombre ? '<div class="muted">🌲 ' + esc(a.fundo_nombre) + '</div>' : '') + (a.observacion ? '<div class="muted">' + esc(a.observacion) + '</div>' : '') + '</div>').join('') ||
    '<div class="muted" style="padding:6px 0;">Sin actividades registradas.</div>');
  html += '</div>';
  $('av-sheet').innerHTML = html;
  $('ov-avance').classList.add('show'); document.body.style.overflow = 'hidden';
  const m = montarMapa($('bt-ficha-mapa'), null, null, {});
  if (!m.map) return;
  const lim = [];
  acts.filter(a => a.lat != null).forEach((a, i) => { L.circleMarker([a.lat, a.lng], { radius: 8, color: '#fff', weight: 2, fillColor: a.clasificacion_color || '#2563EB', fillOpacity: .95 }).addTo(m.map).bindTooltip((i + 1) + '. ' + esc(a.actividad || '') + ' ' + btHm(a.inicio)); lim.push([a.lat, a.lng]); });
  if (j && j.lat != null) { L.marker([j.lat, j.lng], { icon: L.divIcon({ className: '', html: '<div class="bt-rombo"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(m.map).bindTooltip('◆ Apertura'); lim.push([j.lat, j.lng]); }
  if (v && (v.rastro || []).length > 1) L.polyline(v.rastro.map(p => [p[0], p[1]]), { color: '#F97316', weight: 3, dashArray: '6 6' }).addTo(m.map);
  if (v && v.ultima) { L.marker([v.ultima.lat, v.ultima.lng], { icon: btIconoVivo(r.tipo_codigo, v.ultima.fecha) }).addTo(m.map).bindTooltip('📡 ' + btHace(v.ultima.fecha)); lim.push([v.ultima.lat, v.ultima.lng]); }
  setTimeout(() => { m.map.invalidateSize(); if (lim.length) m.map.fitBounds(lim, { padding: [24, 24], maxZoom: 15, animate: false }); }, 120);
}
function btIconoVivo(tipo, fecha) {
  const viejo = !fecha || Date.now() - new Date(fecha).getTime() > 15 * 60000;
  return L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15], html: '<div class="bt-vivo' + (viejo ? ' viejo' : '') + '">' + (BT_EMOJI[tipo] || '📍') + '</div>' });
}

// ── 🗺️ Mapa de actividades (día y días anteriores) + ubicación en vivo hoy
async function btPintarMapa() {
  const f = BT.fecha, desde = btSumarDias(f, -(BT.dias - 1)), hoy = hoyISO();
  const c = $('bt-cuerpo');
  c.innerHTML = '<div class="fila" style="margin-bottom:8px;">' + [[1, 'Solo el día'], [3, '3 días'], [7, '7 días']].map(([n, t]) =>
      '<button class="btn btn-mini' + (BT.dias === n ? ' btn-p' : '') + '" data-bt-dias="' + n + '">' + t + '</button>').join('') + '</div>' +
    '<div class="av-mapa" id="bt-mapa" style="height:58vh;"></div><div id="bt-ley" class="card" style="margin-top:10px;"><span class="muted">Cargando…</span></div>';
  const [acts, dia] = await Promise.all([btCargarActs(desde, f), btCargarDia(f)]);
  const vivo = f === hoy ? await btCargarVivo(f) : null;
  if (S.sec !== 'bitacora' || BT.vista !== 'mapa' || BT.fecha !== f) return;
  const ids = new Set(btRecursosFiltrados().map(r => r.id)), rec = id => (BT.recursos || []).find(r => r.id === id) || {};
  const m = montarMapa($('bt-mapa'), null, null, {}); if (!m.map) return;
  BT.mapa = m.map;
  const lim = [], porK = new Map();
  acts.filter(a => ids.has(a.recurso_id) && a.lat != null).forEach(a => {
    const col = a.clasificacion_color || '#2563EB', k = a.clasificacion || a.grupo || 'Otra';
    porK.set(k, { n: ((porK.get(k) || {}).n || 0) + 1, c: col, e: a.clasificacion_emoji || a.grupo_emoji || '' });
    L.circleMarker([a.lat, a.lng], { radius: a.fecha_operativa === f ? 7 : 5, color: '#fff', weight: 1.5, fillColor: col, fillOpacity: a.fecha_operativa === f ? .95 : .55 }).addTo(m.map)
      .bindPopup('<b>' + esc((a.clasificacion_emoji || '') + ' ' + (a.actividad || '')) + '</b><br>' + esc((rec(a.recurso_id).clave_radial || '') + ' · ' + fmtFecha(a.fecha_operativa) + ' ' + btHm(a.inicio) + '–' + btHm(a.fin)) +
        (a.fundo_nombre ? '<br>🌲 ' + esc(a.fundo_nombre) : '') + '<br><a href="#" data-bt-rec="' + esc(a.recurso_id) + '">Ver recurso</a>');
    lim.push([a.lat, a.lng]);
  });
  (dia.lista || []).filter(j => ids.has(j.recurso_id) && j.lat != null).forEach(j => {
    L.marker([j.lat, j.lng], { icon: L.divIcon({ className: '', html: '<div class="bt-rombo"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }) }).addTo(m.map)
      .bindTooltip('◆ Apertura ' + esc(rec(j.recurso_id).clave_radial || '')); lim.push([j.lat, j.lng]);
  });
  let nVivo = 0;
  const capaVivo = L.layerGroup().addTo(m.map);
  const dibujarVivo = v => {
    capaVivo.clearLayers(); nVivo = 0;
    ((v && v.recursos) || []).filter(x => ids.has(x.id)).forEach(x => {
      if ((x.rastro || []).length > 1) L.polyline(x.rastro.map(p => [p[0], p[1]]), { color: '#F97316', weight: 3, opacity: .85, dashArray: '6 6' }).addTo(capaVivo);
      if (!x.ultima) return;
      if (Date.now() - new Date(x.ultima.fecha).getTime() <= 15 * 60000) nVivo++;
      L.marker([x.ultima.lat, x.ultima.lng], { zIndexOffset: 1000, icon: btIconoVivo(x.tipo_codigo, x.ultima.fecha) }).addTo(capaVivo)
        .bindPopup('<b>📡 ' + esc(x.clave || x.codigo || '') + '</b><br>' + esc(btHace(x.ultima.fecha)) + (x.ultima.velocidad != null ? ' · ' + Math.round(x.ultima.velocidad * 3.6) + ' km/h' : '') +
          (x.jornada && x.jornada.jefe ? '<br>⭐ ' + esc(x.jornada.jefe) : '') + '<br><a href="#" data-bt-rec="' + esc(x.id) + '">Ver recurso</a>');
      lim.push([x.ultima.lat, x.ultima.lng]);
    });
  };
  dibujarVivo(vivo);
  setTimeout(() => { m.map.invalidateSize(); if (lim.length) m.map.fitBounds(lim, { padding: [30, 30], maxZoom: 14, animate: false }); }, 120);
  const ley = () => { const cap = $('bt-mapa') && $('bt-mapa').querySelector('.av-cap'); if (cap) cap.textContent = '🧩 ' + [...porK.values()].reduce((s, o) => s + o.n, 0) + ' actividades' + (vivo ? ' · 📡 ' + nVivo + ' en movimiento' : '');
    $('bt-ley').innerHTML = '<b style="font-size:13px;">Actividades ' + (BT.dias > 1 ? 'del ' + fmtFecha(desde) + ' al ' + fmtFecha(f) : 'del día') + '</b>' +
    '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">' + ([...porK.entries()].map(([k, o]) => '<span class="chip" style="--c:' + o.c + '">● ' + esc(o.e + ' ' + k) + ' (' + o.n + ')</span>').join('') || '<span class="muted">Sin actividades con ubicación.</span>') + '</div>' +
    '<div class="muted" style="margin-top:6px;">● actividad (más tenue = días anteriores) · ◆ apertura del día' + (vivo ? ' · <span style="color:#EA580C;font-weight:700;">📡 ' + nVivo + ' en movimiento</span> (gris = más de 15 min sin enviar) · ┅ recorrido de hoy' : '') + '</div>'; };
  ley();
  if (vivo) {   // hoy: la ubicación en vivo se refresca cada 60 s mientras el mapa siga abierto
    const vuelta = async () => { if (S.sec !== 'bitacora' || BT.vista !== 'mapa' || BT.mapa !== m.map) return; dibujarVivo(await btCargarVivo(f, true)); ley(); BT.timer = setTimeout(vuelta, 60000); };
    BT.timer = setTimeout(vuelta, 60000);
  }
}

// ── 📡 En vivo: última ubicación de cada recurso con la jornada abierta
async function btPintarVivo() {
  const f = hoyISO(), c = $('bt-cuerpo');
  c.innerHTML = '<div class="av-mapa" id="bt-mapa" style="height:46vh;"></div><div id="bt-vivo-lista" style="margin-top:10px;"><div class="vacio">Leyendo ubicaciones…</div></div>';
  const m = montarMapa($('bt-mapa'), null, null, {}); if (!m.map) return;
  BT.mapa = m.map;
  const capa = L.layerGroup().addTo(m.map);
  let ajustado = false;
  const dibujar = async forzar => {
    const v = await btCargarVivo(f, forzar);
    if (S.sec !== 'bitacora' || BT.vista !== 'vivo' || BT.mapa !== m.map) return;
    const ids = new Set(btRecursosFiltrados().map(r => r.id));
    const lista = (v.recursos || []).filter(x => ids.has(x.id)).sort((a, b) => (b.ultima ? new Date(b.ultima.fecha).getTime() : 0) - (a.ultima ? new Date(a.ultima.fecha).getTime() : 0));
    capa.clearLayers();
    const lim = [];
    lista.forEach(x => {
      if ((x.rastro || []).length > 1) L.polyline(x.rastro.map(p => [p[0], p[1]]), { color: '#F97316', weight: 2.5, opacity: .7, dashArray: '5 6' }).addTo(capa);
      if (!x.ultima) return;
      L.marker([x.ultima.lat, x.ultima.lng], { icon: btIconoVivo(x.tipo_codigo, x.ultima.fecha) }).addTo(capa)
        .bindTooltip(esc((x.clave || x.codigo || '') + ' · ' + btHace(x.ultima.fecha)), { direction: 'top', offset: [0, -14] });
      lim.push([x.ultima.lat, x.ultima.lng]);
    });
    if (!ajustado && lim.length) { ajustado = true; m.map.invalidateSize(); m.map.fitBounds(lim, { padding: [30, 30], maxZoom: 14, animate: false }); }
    const enMov = lista.filter(x => x.ultima && Date.now() - new Date(x.ultima.fecha).getTime() <= 15 * 60000).length;
    const cap = $('bt-mapa') && $('bt-mapa').querySelector('.av-cap'); if (cap) cap.textContent = '📡 ' + enMov + ' en movimiento · ' + lim.length + ' con ubicación';
    $('bt-vivo-lista').innerHTML = '<div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:8px;">' +
        '<div class="kpi" style="border-left:4px solid #EA580C;"><b style="color:#EA580C;">' + enMov + '</b><span>En movimiento (≤ 15 min)</span></div>' +
        '<div class="kpi" style="border-left:4px solid #94A3B8;"><b>' + lista.filter(x => x.ultima).length + '</b><span>Con ubicación hoy</span></div>' +
        '<div class="kpi" style="border-left:4px solid #DC2626;"><b style="color:#DC2626;">' + lista.filter(x => !x.ultima && x.jornada && x.jornada.en_servicio && !x.jornada.cierre_en).length + '</b><span>Abiertas sin ubicación</span></div></div>' +
      (lista.map(x => {
        const u = x.ultima, viejo = !u || Date.now() - new Date(u.fecha).getTime() > 15 * 60000, col = !u ? '#DC2626' : viejo ? '#94A3B8' : '#EA580C';
        return '<div class="card acc" data-bt-rec="' + esc(x.id) + '" style="--c:' + col + ';cursor:pointer;"><div style="display:flex;justify-content:space-between;gap:8px;">' +
          '<b>' + (BT_EMOJI[x.tipo_codigo] || '🚩') + ' ' + esc(x.clave || x.codigo || '') + '</b><span class="chip" style="--c:' + col + '">' + (u ? '📡 ' + esc(btHace(u.fecha)) : 'Sin ubicación') + '</span></div>' +
          '<div class="muted">' + esc([x.empresa, rcTit(x.area || ''), x.jornada && x.jornada.turno ? '🕒 ' + x.jornada.turno : ''].filter(Boolean).join(' · ')) +
          (u && u.velocidad != null ? ' · ' + Math.round(u.velocidad * 3.6) + ' km/h' : '') + (x.jornada && x.jornada.jefe ? '<br>⭐ ' + esc(x.jornada.jefe) + (x.jornada.jefe_telefono ? ' · ' + btTel(x.jornada.jefe_telefono) : '') : '') + '</div></div>';
      }).join('') || '<div class="vacio">Ningún recurso con apertura hoy' + (v.sin ? ' (sin señal o falta el SQL 195)' : '') + '.</div>') +
      '<p class="muted" style="text-align:center;">Se actualiza cada minuto · ' + esc(btHm(v.en || Date.now())) + '</p>';
    BT.timer = setTimeout(() => dibujar(true), 60000);
  };
  dibujar(false);
}

document.addEventListener('DOMContentLoaded', () => {
  $('m-cuerpo').addEventListener('click', e => {
    if (S.sec !== 'bitacora') return;
    const v = e.target.closest('[data-btv]'); if (v) { BT.vista = v.dataset.btv; return pintarBitacora(); }
    const d = e.target.closest('[data-bt-dia]'); if (d) { const nf = btSumarDias(BT.fecha, Number(d.dataset.btDia)); if (nf > hoyISO()) return; BT.fecha = nf; return pintarBitacora(); }
    const fi = e.target.closest('[data-bt-filtro]'); if (fi) { e.preventDefault(); BT.filtro = BT.filtro === fi.dataset.btFiltro ? '' : fi.dataset.btFiltro; return btPintarAperturas(); }
    const ds = e.target.closest('[data-bt-dias]'); if (ds) { BT.dias = Number(ds.dataset.btDias); btQuitarMapa(); btParar(); return btPintarMapa(); }
    const rr = e.target.closest('[data-bt-rec]'); if (rr) { e.preventDefault(); return btAbrirRecurso(rr.dataset.btRec); }
  });
  $('m-cuerpo').addEventListener('change', e => {
    if (S.sec !== 'bitacora') return;
    if (e.target.id === 'bt-area') { BT.area = e.target.value; return pintarBitacora(); }
    if (e.target.id === 'bt-tipo') { BT.tipo = e.target.value; return pintarBitacora(); }
  });
  $('av-sheet').addEventListener('click', e => { if (e.target.closest('[data-bt-cerrar]')) return cerrarAvance(); });
});
</script>
</body>
</html>
